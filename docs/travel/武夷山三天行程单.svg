<svg width="1200" height="2000" viewBox="0 0 1200 2000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="2000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="0.45" stop-color="#F2E7D6"/>
      <stop offset="1" stop-color="#E6F0E2"/>
    </linearGradient>
    <linearGradient id="hero" x1="120" y1="110" x2="1080" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6B4F"/>
      <stop offset="1" stop-color="#B85C38"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F7F1E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#7E5C3A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="2000" fill="url(#bg)"/>
  <circle cx="1030" cy="150" r="180" fill="#EBCB8B" fill-opacity="0.28"/>
  <circle cx="170" cy="1810" r="220" fill="#B6D4B0" fill-opacity="0.35"/>
  <path d="M0 330C132 294 228 251 354 270C493 291 546 382 678 390C794 397 902 333 998 299C1070 274 1136 270 1200 286V0H0V330Z" fill="#DCE9D4" fill-opacity="0.75"/>

  <g filter="url(#shadow)">
    <rect x="90" y="80" width="1020" height="360" rx="42" fill="url(#hero)"/>
  </g>
  <text x="140" y="172" fill="#F9F6F0" font-size="34" font-family="'PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="3">XIANG'AN → WUYISHAN</text>
  <text x="140" y="248" fill="#FFF7EC" font-size="68" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">武夷山三天两晚</text>
  <text x="140" y="326" fill="#FFE7D3" font-size="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美食优先 · 山水慢游 · 含《印象大红袍》</text>
  <text x="140" y="386" fill="#F7EBDC" font-size="28" font-family="'PingFang SC','Microsoft YaHei',sans-serif">出发地：厦门翔安 ｜ 节奏：第 1 天动身，第 3 天返程不太晚</text>

  <rect x="140" y="465" width="190" height="58" rx="29" fill="#F5E4D0"/>
  <text x="172" y="503" fill="#8A4B28" font-size="28" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">轻松版路线</text>
  <rect x="350" y="465" width="190" height="58" rx="29" fill="#E6F2E1"/>
  <text x="387" y="503" fill="#2E674E" font-size="28" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">住三姑度假区</text>
  <rect x="560" y="465" width="168" height="58" rx="29" fill="#F7E9BF"/>
  <text x="598" y="503" fill="#7A5A15" font-size="28" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美食加权</text>

  <g filter="url(#shadow)">
    <rect x="90" y="585" width="1020" height="1020" rx="40" fill="url(#card)"/>
  </g>

  <text x="140" y="670" fill="#2C4638" font-size="42" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三天行程单</text>
  <text x="140" y="718" fill="#7A746B" font-size="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议把高铁、住宿、九曲溪竹筏和《印象大红袍》优先订掉，其他按体力机动调整。</text>

  <rect x="130" y="760" width="940" height="250" rx="28" fill="#FFF8EF" stroke="#E8D6C2" stroke-width="2"/>
  <rect x="130" y="760" width="168" height="250" rx="28" fill="#245F49"/>
  <text x="176" y="840" fill="#FFF4E8" font-size="34" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">DAY 1</text>
  <text x="165" y="896" fill="#D7F0E2" font-size="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif">出发日</text>
  <text x="338" y="820" fill="#A25B2A" font-size="30" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">厦门翔安出发 → 抵达武夷山 → 晚上看演出</text>
  <text x="338" y="872" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 到站后直接入住三姑度假区，先把行李放好</text>
  <text x="338" y="918" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 午餐主攻武夷山本地味：岚谷熏鹅、光饼、溪鱼、山笋</text>
  <text x="338" y="964" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 下午不安排硬核爬山，逛三姑或武夷宫，留体力给晚上</text>
  <text x="338" y="1008" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 晚上看《印象大红袍》，演出后就近夜宵或散步回酒店</text>

  <rect x="130" y="1040" width="940" height="250" rx="28" fill="#FFF8EF" stroke="#E8D6C2" stroke-width="2"/>
  <rect x="130" y="1040" width="168" height="250" rx="28" fill="#8A4B28"/>
  <text x="176" y="1120" fill="#FFF1E4" font-size="34" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">DAY 2</text>
  <text x="152" y="1176" fill="#FFE0CE" font-size="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif">核心景观日</text>
  <text x="338" y="1100" fill="#2E674E" font-size="30" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">天游峰 + 九曲溪竹筏 + 晚餐认真吃</text>
  <text x="338" y="1152" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 上午走天游峰，抓最经典的一段山景，早点去体验更舒服</text>
  <text x="338" y="1198" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 中午到下午坐九曲溪竹筏，安排一段不累但很值的山水体验</text>
  <text x="338" y="1244" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 晚饭可以升级一顿：熏鹅、茶香排骨、清烧溪鱼、笋炒肉</text>
  <text x="338" y="1288" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 饭后继续在三姑散步，补吃粉面、卤味、光饼等小吃</text>

  <rect x="130" y="1320" width="940" height="250" rx="28" fill="#FFF8EF" stroke="#E8D6C2" stroke-width="2"/>
  <rect x="130" y="1320" width="168" height="250" rx="28" fill="#D3A34A"/>
  <text x="176" y="1400" fill="#5E4412" font-size="34" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">DAY 3</text>
  <text x="152" y="1456" fill="#6A521C" font-size="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif">返程收尾日</text>
  <text x="338" y="1380" fill="#A25B2A" font-size="30" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">茶山慢游 + 收尾午饭 + 下午返厦门</text>
  <text x="338" y="1432" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 上午走轻松线：大红袍景区或水帘洞方向，偏茶文化与慢游</text>
  <text x="338" y="1478" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 中午吃这趟最后一顿本地菜，再补买茶叶伴手礼</text>
  <text x="338" y="1524" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 下午返程，目标是不拖太晚，晚上能比较从容地回到翔安</text>
  <text x="338" y="1568" fill="#3D3A34" font-size="26" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 返程前记得预留站点接驳和取行李时间</text>

  <g filter="url(#shadow)">
    <rect x="90" y="1645" width="492" height="250" rx="34" fill="#FFFDF8"/>
    <rect x="618" y="1645" width="492" height="250" rx="34" fill="#FFFDF8"/>
  </g>

  <text x="132" y="1710" fill="#2C4638" font-size="34" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">武夷山必吃清单</text>
  <text x="132" y="1760" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 岚谷熏鹅</text>
  <text x="132" y="1802" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 光饼 / 光饼夹肉</text>
  <text x="132" y="1844" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 溪鱼 / 河鲜</text>
  <text x="324" y="1760" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 山笋类小炒</text>
  <text x="324" y="1802" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 茶香排骨 / 茶香鸡</text>
  <text x="324" y="1844" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 粉面 / 卤味夜宵</text>

  <text x="660" y="1710" fill="#2C4638" font-size="34" font-weight="700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">行前提醒</text>
  <text x="660" y="1760" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 优先预订：高铁、酒店、竹筏、演出</text>
  <text x="660" y="1802" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 住宿建议：三姑度假区，吃饭和看演出都方便</text>
  <text x="660" y="1844" fill="#3D3A34" font-size="25" font-family="'PingFang SC','Microsoft YaHei',sans-serif">• 节奏以轻松为主，不把三天排成赶路打卡</text>

  <text x="90" y="1950" fill="#7A746B" font-size="22" font-family="'PingFang SC','Microsoft YaHei',sans-serif">适用版本：三天两晚 / 厦门翔安出发 / 不写具体车次时间 / 可继续细化成详细订票版</text>
</svg>

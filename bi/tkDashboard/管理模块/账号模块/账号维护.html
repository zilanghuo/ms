<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号维护</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --text: #333;
      --muted: #666;
      --muted-2: #94a3b8;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --input-border: #d1d5db;
      --primary: var(--accent);
      --primary-hover: var(--accent-hover);
      --blue: #2b6fbd;
      --border: #e0e0e0;
      --soft-border: #e0e0e0;
      --header-bg: #f9fafb;
      --row-hover: #f9fafb;
      --danger: #dc2626;
      --success: #059669;
      --warning: #b7791f;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .page { width: 100%; padding: 28px 14px 34px; overflow-x: hidden; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .query-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .query-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; }
    .query-item { display: flex; align-items: center; gap: 0.35rem; }
    .query-item .label { color: var(--text); font-size: 0.9rem; white-space: nowrap; }
    .query-item select { border: 1px solid var(--input-border); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; color: var(--text); background: #fff; min-width: 160px; cursor: pointer; height: 38px; }
    .query-item input[type="text"] { border: 1px solid var(--input-border); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; color: var(--text); background: #fff; height: 38px; min-width: 160px; }
    .search-query-item { position: relative; gap: 0; }
    .search-query-item select { min-width: 0; }
    .search-query-item .search-field-select { width: 112px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .search-query-item .search-mode-select { width: 102px; margin-left: -1px; border-radius: 0; }
    .search-query-item .search-input { width: 210px; min-width: 0; margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .query-actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .title { margin: 0; color: var(--text); font-size: 1.25rem; font-weight: 600; line-height: 1.25; }
    .subtitle { margin-top: 4px; color: #8aa0b8; font-size: 13px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; padding-top: 2px; color: #64748b; font-size: 14px; font-weight: 600; }
    .trash-btn { width: 32px; height: 32px; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .trash-btn:hover { background: #f9fafb; color: var(--danger); }
    .btn { height: 36px; border-radius: 4px; border: 1px solid transparent; background: #fff; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0.45rem 1rem; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
    .btn svg { width: 16px; height: 16px; }
    .btn-light { border-color: var(--input-border); box-shadow: none; }
    .btn-light:hover { background: #f9fafb; }
    .btn-secondary { color: var(--text); border-color: var(--input-border); background: #fff; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-query { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-query:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .summary { display: flex; align-items: center; gap: 28px; margin: 6px 0 14px; color: #64748b; font-size: 0.85rem; font-weight: 500; }
    .summary span { display: inline-flex; align-items: center; gap: 2px; }
    .summary strong { font-weight: 800; }
    .summary .total strong { color: #47709a; }
    .summary .active-count strong { color: #13a277; }
    .summary .pause-count strong { color: #d9a117; }
    .summary .stop-count strong { color: #909eb1; }
    .table-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: none; margin-bottom: 1rem; }
    .table-wrap { width: 100%; overflow-x: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
    thead th { height: 50px; background: var(--header-bg); color: var(--muted); border: 1px solid var(--border); text-align: left; font-weight: 500; padding: 0.5rem 0.65rem; }
    thead th:last-child { border-right: none; }
    tbody td { height: 58px; border: 1px solid var(--border); padding: 0.5rem 0.65rem; color: var(--text); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--row-hover); }
    .check-cell { width: 70px; text-align: center; padding: 0 !important; }
    .checkbox { width: 15px; height: 15px; border: 1px solid #d7e1ec; border-radius: 4px; background: #fff; display: inline-block; vertical-align: middle; }
    .handle { display: inline-flex; align-items: center; gap: 5px; color: #566b84; max-width: 100%; }
    .handle-link { color: #566b84; text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
    .handle-link:hover { color: var(--accent); text-decoration: underline; }
    .handle-edit { color: var(--accent); cursor: pointer; font-size: 12px; flex: none; }
    .handle-edit:hover { color: var(--accent-hover); text-decoration: underline; }
    .inline-edit { width: 100%; height: 30px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 8px; color: var(--text); background: #fff; outline: none; box-shadow: 0 0 0 2px rgba(13,148,136,.12); }
    .external { width: 13px; height: 13px; color: #61758c; flex: none; }
    .sortable { display: inline-flex; align-items: center; gap: 4px; }
    .sort-icon { color: #91a3b5; font-size: 13px; letter-spacing: -4px; transform: translateY(-1px); }
    .tag { min-width: 52px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; font-size: 12px; font-weight: 800; }
    .tag-channel { color: #0f766e; background: #ccfbf1; }
    .tag-creator { color: #92400e; background: #fef3c7; }
    .tag-agency { color: #991b1b; background: #fee2e2; min-width: 66px; }
    .gender { min-width: 28px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
    .gender-f { color: #e64b5d; background: #fff1f3; }
    .gender-m { color: #20759d; background: #eaf7fb; }
    .gender-u { color: #8495a8; background: #f2f5f7; }
    .status { display: inline-flex; align-items: center; gap: 4px; color: #36506b; }
    .chev { width: 12px; height: 12px; color: #5f7185; }
    .muted { color: #b1bdc9; }
    .actions { display: inline-flex; align-items: center; gap: 10px; color: var(--primary); }
    .action { border: none; background: transparent; color: var(--accent); padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
    .action svg { width: 15px; height: 15px; }
    .action:hover { color: var(--primary-hover); }
    .w-handle { width: 15%; }
    .w-uid { width: 17%; }
    .w-type { width: 10%; }
    .w-site { width: 8%; }
    .w-store { width: 15%; }
    .w-owner { width: 10%; }
    .w-status { width: 9%; }
    .w-gender { width: 9%; }
    .w-action { width: 7%; }
    .drawer-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .36); display: none; justify-content: flex-end; z-index: 30; }
    .drawer-mask.show { display: flex; }
    .drawer { width: 520px; height: 100%; background: #fff; box-shadow: -18px 0 36px rgba(15, 23, 42, .18); display: flex; flex-direction: column; }
    .drawer-head { height: 58px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .drawer-title { font-size: 17px; font-weight: 600; color: var(--text); }
    .drawer-close { border: none; background: #f5f6f8; color: #73869b; width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 20px; line-height: 1; }
    .drawer-body { padding: 18px 20px 10px; overflow: auto; flex: 1; }
    .form-section { margin-bottom: 18px; }
    .section-title { color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-left: 8px; border-left: 3px solid var(--accent); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 6px; color: #6d8199; font-size: 12px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
    .field input, .field select { height: 36px; padding: 0 10px; }
    .field textarea { min-height: 76px; padding: 9px 10px; resize: vertical; }
    .drawer-actions { border-top: 1px solid var(--border); height: 62px; padding: 12px 20px; display: flex; justify-content: flex-end; gap: 10px; }
    .content-note { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-top: 1rem; color: #52657a; font-size: 13px; }
    .content-note-title { margin-bottom: 6px; color: var(--text); font-size: 14px; font-weight: 600; }
    .content-note ol { margin: 0; padding-left: 20px; }
    .content-note li { margin: 0; line-height: 1.7; }
    .toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s ease; background: #172b46; color: #fff; border-radius: 8px; padding: 9px 16px; box-shadow: 0 10px 24px rgba(15, 23, 42, .22); z-index: 40; font-weight: 700; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .ai-float { position: fixed; right: -10px; bottom: 58px; width: 50px; height: 44px; border-radius: 22px 0 0 22px; border: none; background: #fff; box-shadow: 0 10px 30px rgba(20, 40, 70, .13); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .ai-float::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 45deg, #4ade80, #22c55e, #93c5fd, #fef08a, #4ade80); clip-path: polygon(50% 0, 72% 31%, 100% 36%, 78% 58%, 84% 90%, 50% 75%, 16% 90%, 22% 58%, 0 36%, 28% 31%); }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1 class="title">账号维护</h1>
        <div class="subtitle">管理所有 TikTok 账号档案，包含渠道号、达人号和 TAP 机构号的基础信息与登录凭证</div>
      </div>
      <div class="header-right">
        <span>共 <strong id="totalTop">10</strong> 条记录</span>
        <button class="trash-btn" title="回收站" aria-label="回收站">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </header>

    <div class="query-card">
      <div class="query-row">
        <div class="query-item">
          <span class="label">账号类型</span>
          <select id="typeFilter">
            <option value="all">全部账号</option>
            <option value="渠道号">自营账号</option>
            <option value="达人号">达人账号</option>
            <option value="TAP 机构号">TAP机构账号</option>
          </select>
        </div>
        <div class="query-item">
          <span class="label">国家/站点</span>
          <select id="siteFilter">
            <option value="">全部站点</option>
            <option value="US">US</option>
            <option value="UK">UK</option>
            <option value="AU">AU</option>
          </select>
        </div>
        <div class="query-item">
          <span class="label">账号状态</span>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="活跃">活跃</option>
            <option value="暂停">暂停</option>
            <option value="停用">停用</option>
          </select>
        </div>
        <div class="query-item">
          <span class="label">运营人员</span>
          <input type="text" id="ownerFilter" placeholder="请输入" />
        </div>
        <div class="query-item search-query-item">
          <select class="search-field-select" id="searchField">
            <option value="all">账号/UID</option>
            <option value="handle">Handle</option>
            <option value="uid">UID</option>
          </select>
          <select class="search-mode-select" id="searchMode">
            <option value="fuzzy">模糊搜索</option>
            <option value="exact">精确搜索</option>
          </select>
          <input type="text" class="search-input" id="searchInput" placeholder="请输入" />
        </div>
        <div class="query-actions">
          <button type="button" class="btn btn-query" id="btnQuery">查询</button>
          <button type="button" class="btn btn-secondary" id="btnReset">重置</button>
          <button type="button" class="btn btn-query" id="addBtn">＋ 新增账号</button>
        </div>
      </div>
    </div>

    <div class="summary">
      <span class="total">共 <strong id="totalCount">10</strong> 条</span>
      <span class="active-count">活跃 <strong id="activeCount">8</strong></span>
      <span class="pause-count">暂停 <strong id="pauseCount">1</strong></span>
      <span class="stop-count">停用 <strong id="stopCount">1</strong></span>
    </div>

    <section class="table-card">
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="check-cell"><span class="checkbox"></span></th>
            <th class="w-handle"><span class="sortable">Handle Name <span class="sort-icon">↕</span></span></th>
            <th class="w-uid"><span class="sortable">TikTok UID <span class="sort-icon">↕</span></span></th>
            <th class="w-type"><span class="sortable">账号类型 <span class="sort-icon">↕</span></span></th>
            <th class="w-site"><span class="sortable">国家/站点 <span class="sort-icon">↕</span></span></th>
            <th class="w-store">内容挂车店铺</th>
            <th class="w-owner"><span class="sortable">运营人员 <span class="sort-icon">↕</span></span></th>
            <th class="w-status"><span class="sortable">账号状态 <span class="sort-icon">↕</span></span></th>
            <th class="w-gender">账号定位性别</th>
            <th class="w-action">操作</th>
          </tr>
        </thead>
        <tbody id="accountRows"></tbody>
      </table>
      </div>
    </section>

    <section class="content-note" aria-label="内容说明">
      <div class="content-note-title">内容说明</div>
      <ol>
        <li>该数据源为手动维护，没有第三方的 API 相关提供。</li>
      </ol>
    </section>
  </div>

  <div class="drawer-mask" id="drawerMask">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle">新增账号</div>
        <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
      </div>
      <div class="drawer-body">
        <div class="form-section">
          <div class="section-title">基础信息</div>
          <div class="form-grid">
            <div class="field"><label>Handle Name</label><input id="formHandle" value="@new_account" /></div>
            <div class="field"><label>TikTok UID</label><input id="formUid" value="7234567890123456799" /></div>
            <div class="field"><label>账号类型</label><select id="formType"><option>渠道号</option><option>达人号</option><option>TAP 机构号</option></select></div>
            <div class="field"><label>国家/站点</label><select id="formSite"><option>US</option><option>UK</option><option>AU</option></select></div>
            <div class="field"><label>账号状态</label><select id="formStatus"><option>活跃</option><option>暂停</option><option>停用</option></select></div>
            <div class="field"><label>账号定位性别</label><select id="formGender"><option>未知</option><option>女</option><option>男</option></select></div>
          </div>
        </div>
        <div class="form-section">
          <div class="section-title">运营归属</div>
          <div class="form-grid">
            <div class="field"><label>内容挂车店铺</label><input id="formStore" value="FAIABLE US Official" /></div>
            <div class="field"><label>运营人员</label><input id="formOwner" value="Bob Wang" /></div>
            <div class="field full"><label>登录凭证/备注</label><textarea>用于账号档案原型演示，正式系统需加密保存登录凭证并记录授权状态。</textarea></div>
          </div>
        </div>
      </div>
      <div class="drawer-actions">
        <button class="btn btn-light" id="cancelBtn">取消</button>
        <button class="btn btn-query" id="saveBtn">保存</button>
      </div>
    </aside>
  </div>

  <button class="ai-float" title="AI 助手" aria-label="AI 助手"></button>
  <div class="toast" id="toast">已保存账号档案</div>

  <script>
    var accounts = [
      { handle: '@faiable_official', uid: '7234567890123456789', type: '渠道号', site: 'US', store: 'FAIABLE US Official', owner: 'Bob Wang', status: '活跃', gender: '未知' },
      { handle: '@sweetlife_us', uid: '7234567890123456790', type: '达人号', site: 'US', store: 'FAIABLE US Official', owner: 'Carol Liu', status: '活跃', gender: '女' },
      { handle: '@trendhub_uk', uid: '7234567890123456791', type: '渠道号', site: 'UK', store: 'FAIABLE UK Store', owner: 'Emma Li', status: '活跃', gender: '未知' },
      { handle: '@tap_agency_fai', uid: '7234567890123456792', type: 'TAP 机构号', site: 'US', store: '—', owner: 'Alice Chen', status: '活跃', gender: '未知' },
      { handle: '@homestyle_creator', uid: '7234567890123456793', type: '达人号', site: 'US', store: 'CrossShop Global', owner: 'David Zhang', status: '活跃', gender: '女' },
      { handle: '@fitness_frank', uid: '7234567890123456794', type: '达人号', site: 'US', store: 'TrendHub US', owner: 'Frank Wu', status: '暂停', gender: '男' },
      { handle: '@au_lifestyle_hub', uid: '7234567890123456795', type: '渠道号', site: 'AU', store: 'FAIABLE AU Store', owner: 'Grace Zhao', status: '活跃', gender: '未知' },
      { handle: '@petlover_grace', uid: '7234567890123456796', type: '达人号', site: 'US', store: 'CrossShop Global', owner: 'Grace Zhao', status: '活跃', gender: '女' },
      { handle: '@tap_crossshop', uid: '7234567890123456797', type: 'TAP 机构号', site: 'US', store: '—', owner: 'Henry Sun', status: '活跃', gender: '未知' },
      { handle: '@old_channel_us', uid: '7234567890123456798', type: '渠道号', site: 'US', store: '—', owner: 'Bob Wang', status: '停用', gender: '未知' }
    ];
    function iconExternal() {
      return '<svg class="external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7"/><path d="M9 7h8v8"/><path d="M19 19H5V5h7"/></svg>';
    }
    function iconChevron() {
      return '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
    }
    function typeTag(type) {
      var cls = type === '渠道号' ? 'tag-channel' : (type === '达人号' ? 'tag-creator' : 'tag-agency');
      return '<span class="tag ' + cls + '">' + type + '</span>';
    }
    function handleUrl(handle) {
      return 'https://www.tiktok.com/' + String(handle || '').replace(/^@/, '@');
    }
    function normalizeUrl(value) {
      value = String(value || '').trim();
      if (!value) return '';
      return /^https?:\/\//i.test(value) ? value : 'https://' + value;
    }
    function renderHandle(item, index) {
      var url = item.url || handleUrl(item.handle);
      return '<span class="handle"><a class="handle-link" href="' + url + '" target="_blank" rel="noopener">' + item.handle + '</a>' + iconExternal() + '<span class="handle-edit" data-url-index="' + index + '">编辑URL</span></span>';
    }
    function genderTag(gender) {
      var cls = gender === '女' ? 'gender-f' : (gender === '男' ? 'gender-m' : 'gender-u');
      return '<span class="gender ' + cls + '">' + gender + '</span>';
    }
    function filteredAccounts() {
      var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      var type = document.getElementById('typeFilter').value;
      var site = document.getElementById('siteFilter').value;
      var status = document.getElementById('statusFilter').value;
      var owner = document.getElementById('ownerFilter').value.trim().toLowerCase();
      var searchField = document.getElementById('searchField').value;
      var searchMode = document.getElementById('searchMode').value;
      return accounts.filter(function(item) {
        if (type !== 'all' && item.type !== type) return false;
        if (site && item.site !== site) return false;
        if (status && item.status !== status) return false;
        if (owner && item.owner.toLowerCase().indexOf(owner) === -1) return false;
        if (!keyword) return true;
        var targets = searchField === 'handle' ? [item.handle] : (searchField === 'uid' ? [item.uid] : [item.handle, item.uid]);
        return targets.some(function(target) {
          target = String(target).toLowerCase();
          return searchMode === 'exact' ? target === keyword : target.indexOf(keyword) > -1;
        });
      });
    }
    function render() {
      var rows = filteredAccounts();
      var html = rows.map(function(item, index) {
        return '<tr>' +
          '<td class="check-cell"><span class="checkbox"></span></td>' +
          '<td>' + renderHandle(item, index) + '</td>' +
          '<td>' + item.uid + '</td>' +
          '<td>' + typeTag(item.type) + '</td>' +
          '<td>' + item.site + '</td>' +
          '<td class="' + (item.store === '—' ? 'muted' : '') + '">' + item.store + '</td>' +
          '<td>' + item.owner + '</td>' +
          '<td><span class="status">' + item.status + iconChevron() + '</span></td>' +
          '<td>' + genderTag(item.gender) + '</td>' +
          '<td><span class="actions"><button class="action" data-index="' + index + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>编辑</button><button class="action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/></svg></button></span></td>' +
        '</tr>';
      }).join('');
      document.getElementById('accountRows').innerHTML = html;
      document.getElementById('totalTop').textContent = rows.length;
      document.getElementById('totalCount').textContent = rows.length;
      document.getElementById('activeCount').textContent = rows.filter(function(i) { return i.status === '活跃'; }).length;
      document.getElementById('pauseCount').textContent = rows.filter(function(i) { return i.status === '暂停'; }).length;
      document.getElementById('stopCount').textContent = rows.filter(function(i) { return i.status === '停用'; }).length;
      Array.prototype.forEach.call(document.querySelectorAll('.action[data-index]'), function(btn) {
        btn.addEventListener('click', function() { openDrawer('编辑账号', rows[Number(btn.getAttribute('data-index'))]); });
      });
    }
    function openDrawer(title, item) {
      document.getElementById('drawerTitle').textContent = title;
      if (item) {
        document.getElementById('formHandle').value = item.handle;
        document.getElementById('formUid').value = item.uid;
        document.getElementById('formType').value = item.type;
        document.getElementById('formSite').value = item.site;
        document.getElementById('formStatus').value = item.status;
        document.getElementById('formGender').value = item.gender;
        document.getElementById('formStore').value = item.store === '—' ? '' : item.store;
        document.getElementById('formOwner').value = item.owner;
      }
      document.getElementById('drawerMask').classList.add('show');
    }
    function closeDrawer() { document.getElementById('drawerMask').classList.remove('show'); }
    function showToast(text) {
      var toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1600);
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('typeFilter').addEventListener('change', render);
    document.getElementById('siteFilter').addEventListener('change', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('ownerFilter').addEventListener('input', render);
    document.getElementById('searchField').addEventListener('change', render);
    document.getElementById('searchMode').addEventListener('change', render);
    document.getElementById('btnQuery').addEventListener('click', render);
    document.getElementById('btnReset').addEventListener('click', function() {
      document.getElementById('typeFilter').value = 'all';
      document.getElementById('siteFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('ownerFilter').value = '';
      document.getElementById('searchField').value = 'all';
      document.getElementById('searchMode').value = 'fuzzy';
      document.getElementById('searchInput').value = '';
      render();
    });
    document.getElementById('accountRows').addEventListener('click', function(event) {
      var edit = event.target.closest('[data-url-index]');
      if (!edit) return;
      var index = Number(edit.getAttribute('data-url-index'));
      var item = filteredAccounts()[index];
      var parent = edit.closest('.handle');
      var oldValue = item.url || handleUrl(item.handle);
      parent.innerHTML = '<input class="inline-edit" value="' + oldValue + '" />';
      var input = parent.querySelector('input');
      input.focus();
      input.select();
      function save() {
        item.url = normalizeUrl(input.value) || handleUrl(item.handle);
        render();
        showToast('已保存 Handle URL');
      }
      input.addEventListener('blur', save, { once: true });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          input.removeEventListener('blur', save);
          render();
        }
      });
    });
    document.getElementById('addBtn').addEventListener('click', function() { openDrawer('新增账号'); });
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('cancelBtn').addEventListener('click', closeDrawer);
    document.getElementById('saveBtn').addEventListener('click', function() { closeDrawer(); showToast('已保存账号档案'); });
    document.getElementById('drawerMask').addEventListener('click', function(event) { if (event.target === event.currentTarget) closeDrawer(); });
    render();
  </script>
</body>
</html>

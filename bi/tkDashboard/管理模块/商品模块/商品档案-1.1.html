<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品档案 1.1</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --text: #333; --muted: #666; --accent: #0d9488; --accent-hover: #0f766e; --border: #e0e0e0; --input-border: #d1d5db; --header-bg: #f8fafc; --danger: #dc2626; --success: #16a34a; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; margin: 0; padding: 1.5rem; font-size: 14px; }
    .container { max-width: 100%; margin: 0 auto; }
    .page-title { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; color: var(--text); }
    .query-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .query-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; }
    .query-item { display: flex; align-items: center; gap: 0.35rem; }
    .query-item .label { color: var(--text); font-size: 0.9rem; white-space: nowrap; }
    .query-item select { border: 1px solid var(--input-border); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; color: var(--text); background: #fff; min-width: 160px; cursor: pointer; height: 38px; }
    .query-item input[type="text"] { border: 1px solid var(--input-border); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; color: var(--text); background: #fff; height: 38px; min-width: 160px; }
    .search-query-item { position: relative; gap: 0; }
    .search-query-item select { min-width: 0; }
    .search-query-item .search-field-select { width: 92px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .search-query-item .search-mode-select { width: 102px; margin-left: -1px; border-radius: 0; }
    .search-query-item .search-input { width: 180px; min-width: 0; margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .query-actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .btn { border-radius: 4px; padding: 0.45rem 1rem; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; background: #fff; color: var(--text); display: inline-flex; align-items: center; gap: 0.35rem; height: 38px; }
    .btn-query { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-query:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-secondary { background: #fff; color: var(--text); border-color: var(--input-border); }
    .btn-secondary:hover { background: #f9fafb; }
    .action-bar { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .action-bar .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .meta-info { color: var(--muted); font-size: 0.85rem; }
    .tabs { display: inline-flex; border: 1px solid var(--accent); border-radius: 4px; overflow: hidden; }
    .tab { padding: 0.45rem 0.85rem; font-size: 0.88rem; cursor: pointer; background: #fff; color: var(--accent); border: none; border-right: 1px solid var(--accent); }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:hover:not(.active) { background: #f0fdfa; }
    .tab .count { margin-left: 0.25rem; opacity: 0.85; }
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 2740px; table-layout: fixed; }
    table.spu-board { min-width: 2480px; }
    table.pid-board { min-width: 1780px; }
    th, td { border: 1px solid var(--border); padding: 0.55rem 0.65rem; text-align: left; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background: var(--header-bg); color: var(--muted); font-weight: 600; }
    th.th-factor { background: #eff6ff; color: #1d4ed8; text-align: center; }
    td.num-factor { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:hover td { background: #f9fafb; }
    .pagination { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #fff; color: #64748b; font-size: 13px; }
    .pagination-left, .pagination-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-size { height: 32px; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: var(--text); padding: 0 8px; }
    .page-btn { min-width: 32px; height: 32px; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: #52657a; cursor: pointer; }
    .page-btn:hover:not(:disabled) { background: #f9fafb; color: var(--accent); border-color: var(--accent); }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .page-btn:disabled { cursor: not-allowed; color: #cbd5e1; background: #f8fafc; }
    .w-check { width: 44px; text-align: center; }
    .w-pid { width: 190px; }
    .w-shop { width: 190px; }
    .w-site { width: 64px; }
    .w-img { width: 70px; }
    .w-status { width: 88px; }
    .w-spu { width: 120px; }
    .w-sku { width: 150px; }
    .w-main-sku { width: 150px; }
    .sku-detail-row > td { background: #f8fafc !important; padding: 0.75rem 1rem; overflow: visible; white-space: normal; }
    .sku-detail-panel { border: 1px solid #dbeafe; border-radius: 8px; background: #fff; overflow-x: auto; overflow-y: hidden; width: 100%; min-width: 0; }
    .sku-detail-title { padding: 0.65rem 0.8rem; background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .sku-detail-table { width: 2740px; min-width: 2740px; font-size: 0.76rem; table-layout: fixed; }
    .sku-detail-table th, .sku-detail-table td { white-space: nowrap; padding: 0.42rem 0.55rem; overflow: hidden; text-overflow: ellipsis; }
    .toggle-mark { display: none; }
    .expand-link { color: var(--accent); cursor: pointer; font-weight: 600; }
    .expand-link:hover { text-decoration: underline; }
    .expandable-row { cursor: default; }
    .modal.detail-modal { width: min(1180px, calc(100vw - 40px)); }
    .modal.detail-modal .modal-body { padding: 0; }
    .detail-modal-tip { padding: 12px 18px 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .detail-modal-table-wrap { overflow: auto; max-height: min(62vh, 560px); padding: 12px 18px 16px; }
    .detail-modal-table { width: 100%; min-width: 1680px; border-collapse: collapse; font-size: 0.76rem; table-layout: fixed; }
    .detail-modal-table th, .detail-modal-table td { border: 1px solid var(--border); padding: 0.42rem 0.55rem; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-modal-table th { background: var(--header-bg); color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 1; }
    .detail-modal-table tbody tr:hover td { background: #f9fafb; }
    .w-name { width: 230px; }
    .w-cat { width: 190px; }
    .w-small { width: 104px; }
    .w-month { width: 78px; }
    .w-op { width: 112px; }
    .factor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
    .factor-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; margin-bottom: 14px; }
    .factor-meta .readonly { min-height: 34px; display: flex; align-items: center; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; background: #f8fafc; color: var(--text); font-size: 13px; }
    .product-img { width: 34px; height: 38px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); background: #f3f4f6; display: inline-flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 12px; }
    .swatch { position: relative; overflow: hidden; }
    .swatch::after { content: ''; position: absolute; left: 7px; right: 7px; top: 5px; bottom: 5px; border-radius: 8px 8px 4px 4px; background: rgba(255,255,255,.7); box-shadow: inset 0 -9px 0 rgba(0,0,0,.08); }
    .swatch-ivory { background: linear-gradient(135deg,#f8fafc,#e9d5c2); }
    .swatch-yellow { background: linear-gradient(135deg,#fef9c3,#d9f99d); }
    .swatch-green { background: linear-gradient(135deg,#bbf7d0,#34d399); }
    .swatch-dark { background: linear-gradient(135deg,#14532d,#111827); }
    .swatch-red { background: linear-gradient(135deg,#fecaca,#b91c1c); }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-on { background: #dcfce7; color: var(--success); }
    .badge-pass { background: #d1fae5; color: var(--success); }
    .dot::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50%; margin-right: 5px; }
    .icon-btn { min-width: 30px; height: 30px; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: var(--text); cursor: pointer; margin-right: 0.35rem; }
    .icon-btn:hover { background: #f9fafb; }
    .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: none; z-index: 50; }
    .drawer-mask.open { display: block; }
    .drawer { position: fixed; right: 0; top: 0; width: 560px; max-width: calc(100vw - 28px); height: 100vh; background: #fff; z-index: 60; box-shadow: 0 18px 50px rgba(15,23,42,.16); transform: translateX(105%); transition: transform .2s ease; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { height: 56px; padding: 0 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .drawer-title { font-weight: 600; font-size: 1rem; }
    .close { border: 0; background: transparent; font-size: 22px; color: #9ca3af; cursor: pointer; }
    .drawer-body { padding: 18px 22px 84px; overflow: auto; }
    .form-section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 18px; }
    .form-section:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .section-title { font-weight: 600; color: var(--text); margin-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .field.full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .form-input, .form-select, textarea { width: 100%; border: 1px solid var(--input-border); border-radius: 4px; background: #fff; color: var(--text); padding: 0 10px; min-height: 34px; outline: none; }
    .form-input:focus, .form-select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(13,148,136,.12); }
    .form-input.error { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(220,38,38,.12); }
    textarea { min-height: 82px; padding: 8px 10px; resize: vertical; }
    .checks { display: flex; gap: 12px; flex-wrap: wrap; min-height: 34px; align-items: center; }
    .checks label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-weight: 500; color: var(--text); }
    .drawer-actions { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 22px; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: none; align-items: center; justify-content: center; z-index: 70; padding: 20px; }
    .modal-mask.open { display: flex; }
    .modal { width: 560px; max-width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 18px 50px rgba(15,23,42,.2); overflow: hidden; }
    .modal-head { height: 56px; padding: 0 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-weight: 600; font-size: 1rem; }
    .modal-body { padding: 16px 18px; }
    .modal-tip { color: var(--muted); font-size: 13px; margin-bottom: 12px; line-height: 1.7; }
    .column-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
    .column-option { min-height: 34px; border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; display: flex; align-items: center; gap: 8px; color: #52657a; background: #fff; font-size: 13px; }
    .column-option input { width: 15px; height: 15px; accent-color: var(--accent); }
    .modal-actions { border-top: 1px solid var(--border); height: 58px; padding: 11px 18px; display: flex; justify-content: flex-end; gap: 10px; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 90; }
    .toast.show { opacity: .94; }
    .content-note { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-top: 1rem; color: #52657a; font-size: 13px; }
    .content-note-title { margin-bottom: 6px; color: var(--text); font-size: 14px; font-weight: 600; }
    .content-note ol { margin: 0; padding-left: 20px; }
    .content-note li { margin: 0; line-height: 1.7; }
    .doc-link { margin-top: 18px; text-align: left; font-size: 13px; color: var(--muted); }
    .doc-link a { color: var(--accent); text-decoration: none; }
    .doc-link a:hover { text-decoration: underline; }
    @media (max-width: 960px) { body { padding: 1rem; } .query-actions { margin-left: 0; } .form-grid, .form-grid.three, .factor-grid, .factor-meta { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-title">商品档案</h1>

    <div class="query-card">
      <div class="query-row">
        <div class="query-item">
          <div class="tabs" id="tabs">
            <button class="tab active" data-tab="spu">SPU看板</button>
            <button class="tab" data-tab="pid">PID看板</button>
            <button class="tab" data-tab="sku">SKU看板</button>
          </div>
        </div>
        <div class="query-item">
          <span class="label">所属店铺</span>
          <select id="shopFilter">
            <option value="">全部店铺</option>
            <option value="美国TK-艾斯特尼-美区跨境1店">美国TK-艾斯特尼-美区跨境1店</option>
          </select>
        </div>
        <div class="query-item">
          <span class="label">状态</span>
          <select id="statusFilter"><option value="">全部状态</option><option value="在售">在售</option></select>
        </div>
        <div class="query-item" id="auditFilterWrap">
          <span class="label">TK审核状态</span>
          <select id="auditFilter"><option value="">全部审核状态</option><option value="已通过">已通过</option><option value="审核中">审核中</option><option value="未通过">未通过</option></select>
        </div>
        <div class="query-item" id="factorYearWrap">
          <span class="label">月均系数年份</span>
          <select id="factorYear"></select>
        </div>
        <div class="query-item">
          <span class="label">品类</span>
          <select><option>产品品类</option><option>女式上衣</option><option>男式卫衣</option></select>
        </div>
        <div class="query-item">
          <span class="label">品牌</span>
          <select><option>产品品牌</option><option>FAIABLE</option></select>
        </div>
        <div class="query-item">
          <span class="label">负责人</span>
          <input type="text" placeholder="请输入" />
        </div>
        <div class="query-item search-query-item">
          <select class="search-field-select" id="searchField"><option value="spu">SPU</option><option value="sku">SKU</option><option value="pid">PID</option></select>
          <select class="search-mode-select" id="searchMode"><option value="fuzzy">模糊搜索</option><option value="exact">精确搜索</option></select>
          <input type="text" class="search-input" id="searchInput" placeholder="请输入" />
        </div>
        <div class="query-actions">
          <button type="button" class="btn btn-query" id="btnQuery">查询</button>
          <button type="button" class="btn btn-secondary" id="btnReset">重置</button>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <div class="btns">
        <button class="btn btn-secondary">产品说明</button>
        <button class="btn btn-secondary" id="btnColumnConfig">自定义列配置</button>
        <button class="btn btn-secondary" id="btnExport">导出</button>
      </div>
      <div class="meta-info">数据更新时间：2026-05-28 09:12:59</div>
    </div>

    <div class="table-card">
          <div class="table-wrap">
            <table id="productTable" class="sku-board">
              <thead id="productHead"></thead>
              <tbody id="productBody"></tbody>
            </table>
          </div>
          <div class="pagination" aria-label="分页控件">
            <div class="pagination-left">
              <span>每页</span>
              <select class="page-size" id="pageSize">
                <option value="5">5条/页</option>
                <option value="10" selected>10条/页</option>
                <option value="20">20条/页</option>
              </select>
              <span id="pageSummary">共 0 条</span>
            </div>
            <div class="pagination-right">
              <button type="button" class="page-btn" id="pagePrev">‹</button>
              <span id="pageNumbers"></span>
              <button type="button" class="page-btn" id="pageNext">›</button>
            </div>
          </div>
        </div>

    <section class="content-note" aria-label="内容说明">
      <div class="content-note-title">内容说明</div>
      <ol>
        <li>展示每一个 SPU 的月均系数，为上一年的统计系数。</li>
        <li>支持编辑修改。</li>
      </ol>
    </section>

    <div class="doc-link">
      <a href="需求文档.html">查看需求文档</a>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="editDrawer" aria-label="编辑商品">
    <div class="drawer-head"><span class="drawer-title">编辑商品</span><button class="close" id="btnClose">×</button></div>
    <div class="drawer-body">
      <div class="form-section">
        <div class="field full"><label>商品中文名</label><input class="form-input error" id="editName" /></div>
        <div class="form-grid">
          <div class="field"><label>产品主 SPU</label><input class="form-input" id="editSpu" /></div>
          <div class="field"><label>产品主 SKU</label><input class="form-input" id="editMainSku" /></div>
          <div class="field"><label>销售状态</label><select class="form-select" id="editStatus"><option>在售</option><option>停售</option></select></div>
          <div class="field"><label>PID作用</label><input class="form-input" id="editPidUse" value="-" /></div>
          <div class="field"><label>产品品类</label><input class="form-input" id="editCategory" /></div>
          <div class="field"><label>季节（多选）</label><div class="checks"><label><input type="checkbox" />春</label><label><input type="checkbox" />夏</label><label><input type="checkbox" />秋</label><label><input type="checkbox" />冬</label></div></div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">价格信息</div>
        <div class="form-grid three">
          <div class="field"><label>日常折线价</label><input class="form-input" id="editDailyPrice" /></div>
          <div class="field"><label>吊牌价</label><input class="form-input" id="editTagPrice" /></div>
          <div class="field"><label>直播间秒杀价</label><input class="form-input" /></div>
          <div class="field"><label>活动报名价</label><input class="form-input" /></div>
          <div class="field"><label>亚马逊定价</label><input class="form-input" /></div>
          <div class="field"><label>独立站价格</label><input class="form-input" /></div>
          <div class="field"><label>公开佣金</label><input class="form-input" /></div>
          <div class="field"><label>定向佣金</label><input class="form-input" /></div>
          <div class="field"><label>广告佣金</label><input class="form-input" /></div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">运营人员</div>
        <div class="form-grid">
          <div class="field"><label>负责运营</label><input class="form-input" id="editOwner" value="-" /></div>
          <div class="field"><label>负责商务</label><input class="form-input" value="-" /></div>
          <div class="field"><label>负责编导</label><input class="form-input" value="-" /></div>
          <div class="field"><label>负责剪辑</label><input class="form-input" value="-" /></div>
          <div class="field"><label>直播运营</label><input class="form-input" value="-" /></div>
          <div class="field"><label>投放负责人</label><input class="form-input" value="-" /></div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">运营配置</div>
        <div class="form-grid">
          <div class="field"><label>商品运营级别</label><select class="form-select"><option>请选择</option><option>S级</option><option>A级</option><option>B级</option><option>C级</option></select></div>
          <div class="field"><label>商品运营状态</label><select class="form-select"><option>请选择</option><option>重点运营</option><option>常规运营</option><option>观察中</option><option>暂停运营</option></select></div>
          <div class="field full"><label>商品标签</label><input class="form-input" placeholder="如：爆款、潜力款、清仓款，多个标签用逗号分隔" /></div>
        </div>
      </div>

      <div class="form-section">

    // 店铺 + SPU + 年份 → 1~12 月均系数；默认按去年预置
    var monthlyFactors = {};
    function factorKey(shop, spu, year) { return shop + '||' + spu + '||' + year; }
    function defaultMonths(seed) {
      var base = [0.72, 0.78, 0.95, 1.05, 1.12, 1.18, 1.08, 0.98, 1.02, 1.15, 1.22, 0.88];
      return base.map(function(v, i) { return Number((v + ((seed + i) % 7) * 0.01).toFixed(2)); });
    }
    function ensureFactor(shop, spu, year) {
      var key = factorKey(shop, spu, year);
      if (!monthlyFactors[key]) {
        var seed = String(spu || '').split('').reduce(function(sum, ch) { return sum + ch.charCodeAt(0); }, year || 0);
        monthlyFactors[key] = defaultMonths(seed);
      }
      return monthlyFactors[key].slice();
    }
    function getSelectedFactorYear() {
      return parseInt(document.getElementById('factorYear').value, 10) || defaultFactorYear;
    }
    function initFactorYearOptions() {
      var select = document.getElementById('factorYear');

        var opt = document.createElement('option');
        opt.value = String(y);
        opt.textContent = y + (y === defaultFactorYear ? '（去年）' : '（今年）');
        select.appendChild(opt);
      });
      select.value = String(defaultFactorYear);
    }
    function formatFactor(v) {
      if (v == null || v === '') return '-';
      var n = Number(v);
      return isNaN(n) ? '-' : n.toFixed(2);
    }
    function monthCellsHtml(shop, spu) {
      var months = ensureFactor(shop, spu, getSelectedFactorYear());
      return MONTHS.map(function(m) {
        return '<td class="num-factor w-month">' + formatFactor(months[m - 1]) + '</td>';
      }).join('');
    }
    function short(text, n) { return String(text || '').length > n ? String(text).slice(0, n) + '...' : text; }

      var parts = String(item.sku || '').split('-');
      var code = parts.length >= 2 ? parts[parts.length - 2] : '';
      return item.color || colorMap[code] || code || '-';
    }
    function skuSize(item) {
      var parts = String(item.sku || '').split('-');
      return item.size || (parts.length ? parts[parts.length - 1] : '-') || '-';
    }
    function skuCnName(item) { return item.skuName || item.name || '-'; }
    function sellableStock(item) {
      if (item.sellableStock != null) return item.sellableStock;
      var seed = String(item.sku || '').split('').reduce(function(sum, ch) { return sum + ch.charCodeAt(0); }, 0);
      return 20 + (seed % 180);
    }
    function uniqueRows(rows, keyFn) {
      var map = {};
      rows.forEach(function(item) {
        var key = keyFn(item);
        if (!map[key]) map[key] = { item: item, skuCount: 0, pids: {}, shops: {}, prices: [] };
        map[key].skuCount += 1;
        map[key].pids[item.pid] = true;
        map[key].shops[item.shop] = true;
        map[key].prices.push(item.tagPrice);
      });
      return Object.keys(map).map(function(key) { return map[key]; });

    function filterProducts() {

          return '<tr class="expandable-row" data-expand-type="spu" data-expand-key="' + key + '"><td class="w-check"><input type="checkbox" /></td><td><a class="expand-link" href="javascript:void(0)" data-open-detail>' + item.spu + '</a></td><td title="' + item.name + '">' + short(item.name, 16) + '</td><td>' + Object.keys(group.pids).length + '</td><td>' + group.skuCount + '</td><td title="' + item.shop + '">' + short(item.shop, 14) + '</td><td>' + item.site + '</td>' + monthCellsHtml(item.shop, item.spu) + '<td><button class="icon-btn" title="编辑月均系数" data-edit-factor data-shop="' + item.shop + '" data-spu="' + item.spu + '" data-name="' + String(item.name || '').replace(/"/g, '&quot;') + '">✎</button></td></tr>';
        }
        return '<tr class="expandable-row" data-expand-type="pid" data-expand-key="' + key + '"><td class="w-check"><input type="checkbox" /></td><td><a class="expand-link" href="javascript:void(0)" data-open-detail>' + item.pid + '</a></td><td>' + item.spu + '</td><td title="' + item.name + '">' + short(item.name, 16) + '</td><td>' + (item.mainSku || '-') + '</td><td>' + group.skuCount + '</td><td>' + skuColor(item) + '</td><td>' + skuSize(item) + '</td><td title="' + skuCnName(item) + '">' + short(skuCnName(item), 16) + '</td><td>' + sellableStock(item) + '</td><td title="' + item.shop + '">' + short(item.shop, 14) + '</td><td>' + item.site + '</td><td>' + imageHtml(item) + '</td><td><span class="badge badge-on dot">' + item.status + '</span></td><td><span class="badge badge-pass">' + item.audit + '</span></td><td>' + item.pidUse + '</td><td>' + item.owner + '</td><td>' + item.tagPrice + '</td><td><button class="icon-btn" title="编辑" data-edit="' + products.indexOf(item) + '">✎</button></td></tr>';
      }).join('');
    }
    function renderPagination(total) {
      var totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      var start = total ? (currentPage - 1) * pageSize + 1 : 0;
      var end = Math.min(total, currentPage * pageSize);
      document.getElementById('pageSummary').textContent = '共 ' + total + ' 条，当前 ' + start + '-' + end + ' 条';
      document.getElementById('pagePrev').disabled = currentPage <= 1;
      document.getElementById('pageNext').disabled = currentPage >= totalPages;
      var nums = [];
      for (var i = 1; i <= totalPages; i++) {
        nums.push('<button type="button" class="page-btn ' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>');
      }
      document.getElementById('pageNumbers').innerHTML = nums.join('');
    }
    function renderRows() {
      renderHead();
      var rows = filterProducts();
      var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      var pageRows = rows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      var table = document.getElementById('productTable');
      table.className = activeTab === 'sku' ? 'sku-board' : (activeTab === 'pid' ? 'pid-board' : 'spu-board');
      var body = document.getElementById('productBody');
      var skuOption = document.querySelector('#searchField option[value="sku"]');
      if (skuOption) skuOption.hidden = false;
      if (!rows.length) {
        renderPagination(0);
        var colspan = activeTab === 'sku' ? 24 : (activeTab === 'pid' ? 19 : SPU_COLSPAN);
        body.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:#94a3b8;padding:28px;">暂无符合条件的商品档案</td></tr>';
        return;
      }
      renderPagination(rows.length);
      body.innerHTML = activeTab === 'sku' ? renderSkuRows(pageRows) : renderAggregateRows(pageRows, activeTab);
    }
    function openDrawer(item) {
      editingProduct = item;
      document.getElementById('editName').value = item.name;
      document.getElementById('editSpu').value = item.spu;
      document.getElementById('editMainSku').value = item.mainSku || item.sku || '-';
      document.getElementById('editStatus').value = item.status;
      document.getElementById('editPidUse').value = item.pidUse;
      document.getElementById('editCategory').value = item.category;
      document.getElementById('editDailyPrice').value = '-';
      document.getElementById('editTagPrice').value = item.tagPrice;
      document.getElementById('editOwner').value = item.owner;
      document.getElementById('editTkUrl').value = item.tkUrl || ('https://partner.tiktokshop.com/product/' + item.pid);
      document.getElementById('editSiteUrl').value = item.siteUrl || '';
      document.getElementById('editImageUrl').value = item.imageUrl || '';
      document.getElementById('editAssetFolder').value = item.assetFolder || '';
      document.getElementById('drawerMask').classList.add('open');
      document.getElementById('editDrawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawerMask').classList.remove('open');
      document.getElementById('editDrawer').classList.remove('open');
    }
    function openFactorDrawer(shop, spu, name) {
      var year = getSelectedFactorYear();
      editingFactor = { shop: shop, spu: spu, year: year };
      document.getElementById('factorShop').textContent = shop || '-';
      document.getElementById('factorSpu').textContent = spu || '-';
      document.getElementById('factorSpuName').textContent = name || '-';
      document.getElementById('factorYearLabel').textContent = String(year);
      var months = ensureFactor(shop, spu, year);
      document.getElementById('factorInputs').innerHTML = MONTHS.map(function(m) {
        return '<div class="field"><label>' + m + '月系数</label><input class="form-input" type="number" step="0.01" min="0" data-month="' + m + '" value="' + formatFactor(months[m - 1]) + '" /></div>';
      }).join('');
      document.getElementById('factorDrawerMask').classList.add('open');
      document.getElementById('factorDrawer').classList.add('open');
    }
    function closeFactorDrawer() {
      editingFactor = null;
      document.getElementById('factorDrawerMask').classList.remove('open');
      document.getElementById('factorDrawer').classList.remove('open');
    }
    function showToast(text) {
      var toast = document.getElementById('toast');
      if (text) toast.textContent = text;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1400);
    }
    function closeColumnConfig() { document.getElementById('columnConfigMask').classList.remove('open'); }
    document.getElementById('productBody').addEventListener('click', function(e) {
      var factorBtn = e.target.closest('[data-edit-factor]');
      if (factorBtn) {
        e.stopPropagation();
        openFactorDrawer(factorBtn.getAttribute('data-shop'), factorBtn.getAttribute('data-spu'), factorBtn.getAttribute('data-name'));
        return;
      }
      var btn = e.target.closest('[data-edit]');
      if (btn) {
        e.stopPropagation();
        openDrawer(products[parseInt(btn.getAttribute('data-edit'), 10)]);
        return;
      }
      var detailLink = e.target.closest('[data-open-detail]');
      if (!detailLink) return;
      e.preventDefault();
      e.stopPropagation();
      var row = detailLink.closest('.expandable-row');
      if (!row) return;
      var type = row.getAttribute('data-expand-type');
      var key = row.getAttribute('data-expand-key');
      var allRows = filterProducts();
      var detailRows = allRows.filter(function(item) {
        return type === 'spu' ? ((item.shop + '||' + item.spu) === key) : (item.pid === key);
      });
      var first = detailRows[0];
      if (!first) return;
      openDetailModal(type, first, detailRows);
    });
    document.getElementById('detailModalBody').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-edit]');
      if (!btn) return;
      e.stopPropagation();
      closeDetailModal();
      openDrawer(products[parseInt(btn.getAttribute('data-edit'), 10)]);
    });
    function closeDetailModalHandlers() {
      document.getElementById('btnDetailClose').addEventListener('click', closeDetailModal);
      document.getElementById('btnDetailCloseOk').addEventListener('click', closeDetailModal);
      document.getElementById('detailModalMask').addEventListener('click', function(e) {
        if (e.target === e.currentTarget) closeDetailModal();
      });
    }
    closeDetailModalHandlers();
    document.getElementById('tabs').addEventListener('click', function(e) {
      var btn = e.target.closest('.tab');
      if (!btn) return;
      activeTab = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab').forEach(function(tab) { tab.classList.remove('active'); });
      btn.classList.add('active');
      currentPage = 1;
      updateFilterVisibility();
      renderRows();
    });
    function updateFilterVisibility() {
      document.getElementById('auditFilterWrap').style.display = activeTab === 'spu' ? 'none' : '';
      document.getElementById('factorYearWrap').style.display = activeTab === 'spu' ? '' : 'none';
      if (activeTab === 'spu') document.getElementById('auditFilter').value = '';
    }
    function resetPageAndRender() { currentPage = 1; renderRows(); }
    document.getElementById('searchInput').addEventListener('input', resetPageAndRender);
    document.getElementById('searchField').addEventListener('change', resetPageAndRender);
    document.getElementById('searchMode').addEventListener('change', resetPageAndRender);
    document.getElementById('shopFilter').addEventListener('change', resetPageAndRender);
    document.getElementById('auditFilter').addEventListener('change', resetPageAndRender);
    document.getElementById('factorYear').addEventListener('change', resetPageAndRender);
    document.getElementById('btnReset').addEventListener('click', function() {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchMode').value = 'fuzzy';
      document.getElementById('shopFilter').value = '';
      document.getElementById('auditFilter').value = '';
      document.getElementById('factorYear').value = String(defaultFactorYear);
      currentPage = 1;
      renderRows();
    });
    document.getElementById('pageSize').addEventListener('change', function() { pageSize = parseInt(this.value, 10) || 10; currentPage = 1; renderRows(); });
    document.getElementById('pagePrev').addEventListener('click', function() { if (currentPage > 1) { currentPage -= 1; renderRows(); } });
    document.getElementById('pageNext').addEventListener('click', function() { currentPage += 1; renderRows(); });
    document.getElementById('pageNumbers').addEventListener('click', function(e) { var btn = e.target.closest('[data-page]'); if (!btn) return; currentPage = parseInt(btn.getAttribute('data-page'), 10) || 1; renderRows(); });
    document.getElementById('btnClose').addEventListener('click', closeDrawer);
    document.getElementById('btnCancel').addEventListener('click', closeDrawer);
    document.getElementById('drawerMask').addEventListener('click', closeDrawer);
    document.getElementById('btnColumnConfig').addEventListener('click', function() { document.getElementById('columnConfigMask').classList.add('open'); });
    document.getElementById('btnColumnClose').addEventListener('click', closeColumnConfig);
    document.getElementById('btnColumnCancel').addEventListener('click', closeColumnConfig);
    document.getElementById('btnColumnSave').addEventListener('click', function() { closeColumnConfig(); showToast('已保存自定义列配置'); });
    document.getElementById('columnConfigMask').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeColumnConfig(); });
    document.getElementById('btnExport').addEventListener('click', function() { showToast('导出字段将按当前看板和自定义列配置生成'); });
    document.getElementById('btnSave').addEventListener('click', function() {
      if (editingProduct) {
        editingProduct.name = document.getElementById('editName').value.trim() || editingProduct.name;
        editingProduct.spu = document.getElementById('editSpu').value.trim() || editingProduct.spu;
        editingProduct.mainSku = document.getElementById('editMainSku').value.trim() || editingProduct.mainSku || editingProduct.sku;
        editingProduct.status = document.getElementById('editStatus').value;
        editingProduct.pidUse = document.getElementById('editPidUse').value.trim() || '-';
        editingProduct.category = document.getElementById('editCategory').value.trim() || editingProduct.category;
        editingProduct.tagPrice = document.getElementById('editTagPrice').value.trim() || editingProduct.tagPrice;
        editingProduct.owner = document.getElementById('editOwner').value.trim() || '-';
        editingProduct.tkUrl = document.getElementById('editTkUrl').value.trim();
        editingProduct.siteUrl = document.getElementById('editSiteUrl').value.trim();
        editingProduct.imageUrl = document.getElementById('editImageUrl').value.trim();
        editingProduct.assetFolder = document.getElementById('editAssetFolder').value.trim();
        renderRows();
      }
      closeDrawer();
      showToast();
    });
    document.getElementById('btnFactorClose').addEventListener('click', closeFactorDrawer);
    document.getElementById('btnFactorCancel').addEventListener('click', closeFactorDrawer);
    document.getElementById('factorDrawerMask').addEventListener('click', closeFactorDrawer);
    document.getElementById('btnFactorSave').addEventListener('click', function() {
      if (!editingFactor) return;
      var inputs = document.querySelectorAll('#factorInputs [data-month]');
      var months = [];
      var invalid = false;
      inputs.forEach(function(input) {
        var val = parseFloat(input.value);
        if (isNaN(val) || val < 0) {
          input.classList.add('error');
          invalid = true;
        } else {
          input.classList.remove('error');
          months[parseInt(input.getAttribute('data-month'), 10) - 1] = Number(val.toFixed(2));
        }
      });
      if (invalid) {
        showToast('请填写有效的月均系数（≥0）');
        return;
      }
      monthlyFactors[factorKey(editingFactor.shop, editingFactor.spu, editingFactor.year)] = months;
      closeFactorDrawer();
      renderRows();
      showToast('已保存该店铺 SPU 的月均系数');
    });
    initFactorYearOptions();
    updateFilterVisibility();
    renderRows();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>广告BI看板</title>
  <style>

    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --text: #333;
      --muted: #666;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --border: #e0e0e0;
      --input-border: #d1d5db;
      --danger: #dc2626;
      --warn-bg: #fff7ed;
      --warn-text: #9a3412;
      --ok-bg: #f0fdf4;
      --ok-text: #166534;
      --bad-bg: #fef2f2;
      --bad-text: #991b1b;
      --note-bg: #eff6ff;
      --note-text: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      padding: 1.5rem;
      font-size: 14px;
    }
    .container { max-width: 100%; margin: 0 auto; }
    .page-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--text);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      background: #e0f2fe;
      color: #0369a1;
    }
    .query-card, .summary-card, .table-card, .action-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .query-card { padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .query-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; }
    .query-item { display: flex; align-items: center; gap: 0.35rem; }
    .query-item.hidden { display: none; }
    .query-item .label { color: var(--text); font-size: 0.9rem; white-space: nowrap; }
    .query-item input[type="date"], .query-item input[type="text"], .query-item select {
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
    }
    .query-item input[type="text"] { min-width: 180px; }
    .query-item select { min-width: 160px; cursor: pointer; }
    .search-query-item { position: relative; gap: 0; }
    .search-query-item select { min-width: 0; }
    .search-query-item select + select { margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .search-query-item .search-field-select { width: 92px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .search-query-item .search-mode-select { width: 102px; border-radius: 0; }
    .search-query-item .search-fuzzy-input { min-width: 0; width: 170px; margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .search-exact-trigger-wrap { position: relative; display: none; align-items: center; margin-left: -1px; }
    .search-exact-trigger-wrap.active { display: flex; }
    .search-exact-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
      width: 196px;
      height: 38px;
      padding: 0 0.7rem;
      border: 1px solid var(--input-border);
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    .search-exact-trigger.active { border-color: #2563eb; box-shadow: 0 0 0 1px rgba(37,99,235,0.1); }
    .search-exact-trigger .placeholder { color: #94a3b8; }
    .search-exact-trigger .value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.88rem; text-align: left; }
    .search-exact-trigger .icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: #64748b; font-size: 1rem; }
    .search-exact-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 320px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 14px 30px rgba(15,23,42,0.16);
      z-index: 220;
      overflow: hidden;
    }
    .search-exact-panel.open { display: block; }
    .search-exact-body { padding: 0.75rem 0.75rem 0.5rem; }
    .search-exact-textarea {
      width: 100%;
      min-height: 180px;
      resize: none;
      border: none;
      outline: none;
      font-size: 0.84rem;
      line-height: 1.55;
      color: var(--text);
      background: transparent;
      font-family: inherit;
    }
    .search-exact-tip { margin-top: 0.25rem; font-size: 0.78rem; color: #94a3b8; line-height: 1.5; }
    .search-exact-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.65rem 0.75rem 0.75rem; border-top: 1px solid #e2e8f0; background: #fff; }
    .search-exact-count { font-size: 0.78rem; color: #94a3b8; margin-left: auto; }
    .search-exact-actions { display: flex; align-items: center; gap: 0.5rem; }
    .search-exact-btn { min-width: 62px; padding: 0.3rem 0.7rem; border-radius: 4px; border: 1px solid var(--input-border); background: #fff; color: var(--text); cursor: pointer; font-size: 0.82rem; }
    .search-exact-btn:hover { background: #f8fafc; }
    .search-exact-btn.primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .search-exact-btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .query-actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .btn {
      border-radius: 4px;
      padding: 0.45rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-query { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-query:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-secondary { background: #fff; color: var(--text); border-color: var(--input-border); }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-export-transfer { background: #e1f5ee; color: #085041; border-color: #5dcaa5; }
    .btn-export-transfer:hover { background: #c8eddf; border-color: #3fb88f; }
    .btn-export-purchase { background: #e6f1fb; color: #0c447c; border-color: #85b7eb; }
    .btn-export-purchase:hover { background: #d4e8f8; border-color: #5f9fe2; }
    .tab-group {
      display: inline-flex;
      border: 1px solid var(--accent);
      border-radius: 4px;
      overflow: hidden;
    }
    .tab-group .tab {
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #fff;
      color: var(--accent);
      border: none;
      border-right: 1px solid var(--accent);
    }
    .tab-group .tab:last-child { border-right: none; }
    .tab-group .tab.active { background: var(--accent); color: #fff; }
    .tab-group .tab:hover:not(.active) { background: #f0fdfa; }
    .tip-bar {
      margin-top: 0.75rem;
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 0.82rem;
      border: 1px solid #fdba74;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .global-summary-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .summary-card { padding: 0.9rem 1rem; min-height: 90px; }
    .summary-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.45rem; }
    .summary-value { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .summary-sub { margin-top: 0.4rem; font-size: 0.78rem; color: var(--muted); }
    .summary-danger .summary-value { color: var(--danger); }
    .summary-note .summary-value { color: #1d4ed8; }
    .global-alert-bar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }
    .alert-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid #fdba74;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 0.88rem;
      line-height: 1.55;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .alert-item:hover {
      box-shadow: 0 2px 8px rgba(154, 52, 18, 0.12);
      background: #ffedd5;
    }
    .alert-item.urgent { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    .alert-item.urgent:hover {
      background: #fee2e2;
      box-shadow: 0 2px 8px rgba(153, 27, 27, 0.12);
    }
    .alert-main { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .alert-index { font-weight: 700; color: inherit; }
    .alert-count { font-weight: 700; color: inherit; }
    .alert-hint {
      font-size: 0.78rem;
      opacity: 0.75;
      white-space: nowrap;
    }
    .action-bar {
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .action-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem; }
    .action-bar .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .meta-info { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; min-width: 260px; }
    .update-time { font-size: 0.85rem; color: #64748b; }
    .legend {
      flex: 1;
      min-width: 280px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .legend code {
      background: #f1f5f9;
      padding: 0.08rem 0.25rem;
      border-radius: 3px;
    }
    .export-modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.38);
    }
    .export-modal-mask.open { display: flex; }
    .export-modal {
      width: min(720px, 100%);
      max-height: calc(100vh - 3rem);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #dbe7e2;
      border-radius: 8px;
      box-shadow: 0 22px 56px rgba(15, 23, 42, 0.22);
    }
    .export-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.1rem 0.8rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .export-modal-title { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); }
    .export-modal-sub { margin: 0.25rem 0 0; font-size: 0.82rem; color: #64748b; }
    .export-modal-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background: #fff;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }
    .export-modal-close:hover { background: #f8fafc; color: var(--text); }
    .export-modal-body { padding: 1rem 1.1rem; overflow: auto; }
    .export-modal-tip {
      margin-bottom: 0.75rem;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
      font-size: 0.82rem;
    }
    .export-preview-table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .export-preview-table th {
      padding: 0.5rem 0.6rem;
      text-align: left;
      white-space: nowrap;
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }
    .export-preview-table td {
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid #edf2f7;
      white-space: nowrap;
    }
    .export-modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.8rem 1.1rem 1rem;
      border-top: 1px solid #e2e8f0;
      background: #fff;
    }
    .monthly-factor-modal {
      width: min(1280px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
    }
    .monthly-factor-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .monthly-factor-card {
      border: 1px solid #dbe7e2;
      border-radius: 8px;
      background: #f8fffc;
      padding: 0.75rem 0.9rem;
    }
    .monthly-factor-card .label {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .monthly-factor-card .value {
      font-size: 1.35rem;
      font-weight: 650;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .monthly-factor-card .value.updated { color: var(--accent); }
    .monthly-factor-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }
    .monthly-factor-meta .meta-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      padding: 0.55rem 0.7rem;
      font-size: 0.82rem;
      color: #475569;
    }
    .monthly-factor-meta .meta-item strong {
      display: block;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
    }
    .monthly-factor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .monthly-factor-field label {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .monthly-factor-field input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 0 0.65rem;
      font-size: 0.9rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      background: #fff;
    }
    .monthly-factor-field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
    }
    .monthly-factor-field input.error {
      border-color: #dc2626;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.12);
    }
    @media (max-width: 900px) {
      .monthly-factor-summary,
      .monthly-factor-meta,
      .monthly-factor-grid { grid-template-columns: 1fr 1fr; }
    }
    .column-config-mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 520;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.42);
    }
    .column-config-mask.open { display: flex; }
    .column-config-modal {
      width: min(620px, 100%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 22px 56px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }
    .column-config-head {
      height: 56px;
      padding: 0 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .column-config-title { font-weight: 600; font-size: 1rem; color: var(--text); }
    .column-config-close {
      border: 0;
      background: transparent;
      font-size: 22px;
      color: #9ca3af;
      cursor: pointer;
    }
    .column-config-body { padding: 1rem 1.1rem; }
    .column-config-tip { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.75rem; line-height: 1.7; }
    .column-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 0.75rem; }
    .column-option {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.42rem 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #52657a;
      background: #fff;
      font-size: 0.82rem;
    }
    .column-option input { width: 15px; height: 15px; accent-color: var(--accent); }
    .column-config-actions {
      height: 58px;
      padding: 0.7rem 1.1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      font-size: 0.86rem;
    }
    .toast.show { opacity: 0.94; }
    .table-card { overflow: hidden; margin-bottom: 1rem; }
    .table-wrap { overflow: auto; }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      table-layout: auto;
    }
    th, td {
      padding: 0.5rem 0.65rem;
      text-align: left;
      border: 1px solid var(--border);
      white-space: nowrap;
      vertical-align: top;
    }
    th {
      background: #f9fafb;
      color: var(--muted);
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    th.sortable-num {
      position: sticky;
      padding-right: 1.35rem;
    }
    .sort-trigger {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72rem;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      padding: 0.1rem 0.15rem;
      border-radius: 3px;
    }
    .sort-trigger:hover {
      background: #e2e8f0;
      color: var(--text);
    }
    th.sortable-num.sort-asc .sort-trigger,
    th.sortable-num.sort-desc .sort-trigger {
      color: var(--accent);
    }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.center { text-align: center; }
    tr:hover td { background: #f9fafb; }
    tr.row-total td {
      font-weight: 600;
      background: #f0fdf4;
    }
    tr.row-total:hover td {
      background: #dcfce7;
    }
    .sticky-col-1, .sticky-col-2, .sticky-col-3, .sticky-col-4, .sticky-col-5 {
      position: sticky;
      background: var(--card);
      z-index: 1;
      box-shadow: 2px 0 4px -2px rgba(0,0,0,0.08);
    }
    th.sticky-col-1, th.sticky-col-2, th.sticky-col-3, th.sticky-col-4, th.sticky-col-5 {
      z-index: 3;
      background: #f9fafb !important;
    }
    .sticky-col-1 { left: 0; min-width: 120px; }
    .sticky-col-2 { left: 120px; min-width: 140px; }
    .sticky-col-3 { left: 260px; min-width: 140px; }
    .sticky-col-4 { left: 400px; min-width: 180px; }
    .sticky-col-5 { left: 580px; min-width: 160px; }
    .model-table th { min-width: 132px; vertical-align: top; }
    .model-table th.model-key-col { min-width: 170px; }
    .model-table td { white-space: nowrap; }
    .field-head {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      width: 100%;
      line-height: 1.35;
    }
    .field-help {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #93c5fd;
      background: #eff6ff;
      color: #2563eb;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: help;
    }
    .field-tooltip {
      position: fixed;
      width: 340px;
      max-width: calc(100vw - 32px);
      padding: 0.65rem 0.75rem;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: #fff;
      color: #1e293b;
      box-shadow: 0 12px 28px rgba(15,23,42,0.18);
      white-space: pre-line;
      text-align: left;
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1.55;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease, visibility 0s linear 0.12s;
      z-index: 9999;
    }
    .field-tooltip.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition-delay: 0s;
    }
    .model-action-col { min-width: 88px; text-align: center; }
    .row-edit-btn {
      padding: 0.28rem 0.72rem;
      font-size: 0.78rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: #fff;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }
    .row-edit-btn:hover { background: #f0fdfa; }
    .status-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      }
      if (type === "spu") {
        const row = spuRows().find((item)=>item.spu===id);
        if (!row) return null;

        return { label:`${row.spu} · ${row.name}`, metrics:aggregateMetrics(relatedCampaigns), relatedCampaigns, relatedPids:pidRecords.filter((pid)=>row.pids.includes(pid.pid)), relatedCreatives:creativesForPids(row.pids), dailyBudget:sum(relatedCampaigns,"budget") };
      }
      if (type === "pid") {
        const row = pidRecords.find((item)=>item.pid===id);
        if (!row) return null;
        const relatedCampaigns = campaignsForIds(row.campaignIds);
        return { label:`${row.pid} · ${row.name}`, metrics:aggregateMetrics(relatedCampaigns), relatedCampaigns, relatedPids:[row], relatedCreatives:creativesForPids([row.pid]), dailyBudget:sum(relatedCampaigns,"budget") };

      }
      return null;
    }

    function dailySeries(type, id, startDate, endDate, variant = "current") {
      const entity = analysisEntity(type,id);
      if (!entity) return [];
      const days = daysInRange(startDate,endDate);
      const seed = Array.from(`${type}:${id}:${variant}`).reduce((value,char)=>value+char.charCodeAt(0),0);
      let weights = [];
      for (let index=0; index<days; index+=1) weights.push(0.8 + ((seed + index * 13) % 31) / 50);
      const weightTotal = weights.reduce((a,b)=>a+b,0);
      const costFactor = variant === "previous" ? 0.88 + (seed % 9) / 100 : 1;
      const orderFactor = variant === "previous" ? 0.82 + (seed % 13) / 100 : 1;
      const revenueFactor = variant === "previous" ? 0.84 + (seed % 15) / 100 : 1;
      const creative = entity.relatedCreatives?.[0];
      return weights.map((weight,index) => {
        const share = weight / weightTotal;
        const cost = entity.metrics.cost * costFactor * share;

      const files=[
        {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
        {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
        {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xml(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
        {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
        {name:"xl/styles.xml",data:'<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF087C72"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
        {name:"xl/worksheets/sheet1.xml",data:`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${end}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${headers.map((_,index)=>`<col min="${index+1}" max="${index+1}" width="18" customWidth="1"/>`).join("")}</cols><sheetData>${sheetRows}</sheetData><autoFilter ref="A1:${end}"/></worksheet>`}
      ];
      return new Blob([zipStore(files)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    }

    function exportCurrent() {
      const headers = FIELD_SCHEMAS[state.tab];
      if (!state.currentMaps.length) { showToast("当前筛选没有可导出的数据"); return; }
      const rows = state.currentMaps.map((map)=>headers.map((field)=>map[field] == null || map[field] === "" ? "—" : map[field]));
      const blob = xlsxBlob(headers,rows,TAB_META[state.tab].label);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `TK广告BI_${TAB_META[state.tab].label}_2026-09-04.xlsx`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast(`已导出 ${rows.length} 条，包含 ${headers.length} 个映射字段`);
    }

    /* ---------- Events ---------- */
    document.querySelector(".tab-group").addEventListener("click",(event)=>{
      const button=event.target.closest("[data-tab]");
      if(!button)return;
      state.tab=button.dataset.tab;state.query="";state.filters={};state.dateMode=DATE_MODES[state.tab][0].value;state.relationFilter=null;state.expanded=null;byId("searchInput").value="";render();window.scrollTo({top:0,behavior:"smooth"});
    });
    byId("dateFilter").addEventListener("change",(event)=>{if(event.target.value==="custom")return;state.quickRange=event.target.value;state.days=Number(event.target.value);state.startDate=shiftDate(state.endDate,-state.days+1);render();});
    byId("dateMode").addEventListener("change",(event)=>{state.dateMode=event.target.value;render();});
    byId("startDate").addEventListener("change",(event)=>{if(event.target.value>state.endDate){showToast("开始日期不能晚于结束日期");event.target.value=state.startDate;return;}state.startDate=event.target.value;state.days=daysInRange(state.startDate,state.endDate);state.quickRange="custom";render();});
    byId("endDate").addEventListener("change",(event)=>{if(event.target.value<state.startDate){showToast("结束日期不能早于开始日期");event.target.value=state.endDate;return;}state.endDate=event.target.value;state.days=daysInRange(state.startDate,state.endDate);state.quickRange="custom";render();});
    byId("siteFilter").addEventListener("change",(event)=>{state.site=event.target.value;state.store=state.site==="all"?"all":Object.keys(ACCOUNTS).find((store)=>ACCOUNTS[store].site===state.site)||"all";byId("storeFilter").value=state.store;state.relationFilter=null;render();});
    byId("storeFilter").addEventListener("change",(event)=>{state.store=event.target.value;state.site=state.store==="all"?"all":ACCOUNTS[state.store].site;byId("siteFilter").value=state.site;state.relationFilter=null;render();});
    byId("tabFilters").addEventListener("change",(event)=>{const control=event.target.closest("[data-tab-filter]");if(!control)return;state.filters[control.dataset.tabFilter]=control.value;state.relationFilter=null;render();});
    byId("searchInput").addEventListener("input",(event)=>{state.query=event.target.value.trim();state.relationFilter=null;render();});
    byId("contextToggle").addEventListener("click",()=>{state.contextOpen=!state.contextOpen;renderContext();});
    
    byId("queryBtn").addEventListener("click", () => { state.query = byId("searchInput").value.trim(); render(); });
    byId("resetBtn").addEventListener("click", () => {
      state.days = 7; state.quickRange = "7"; state.startDate = "2026-08-28"; state.endDate = "2026-09-03";
      state.site = "US"; state.store = "Sweet-US"; state.query = ""; state.filters = {}; state.relationFilter = null; state.expanded = null;
      byId("searchInput").value = ""; byId("siteFilter").value = "US"; byId("storeFilter").value = "Sweet-US"; byId("dateFilter").value = "7";
      render(); showToast("已重置筛选条件");
    });
    byId("modalCloseFoot").addEventListener("click", () => byId("modalClose").click());
    byId("searchInput").addEventListener("keydown", (event) => { if (event.key === "Enter") { state.query = byId("searchInput").value.trim(); render(); } });

    byId("exportButton").addEventListener("click",exportCurrent);
    byId("viewRoot").addEventListener("click",(event)=>{
      const analyze=event.target.closest("[data-analyze]");if(analyze){openAnalysis(analyze.dataset.analyze);return;}
      const inventory=event.target.closest("[data-inventory]");if(inventory){openInventory(inventory.dataset.inventory);return;}
      const expand=event.target.closest("[data-expand]");if(expand){state.expanded=state.expanded===expand.dataset.expand?null:expand.dataset.expand;render();return;}
      if(event.target.closest("[data-collapse]")){state.expanded=null;render();return;}
      const jump=event.target.closest("[data-jump]");if(jump){state.tab=jump.dataset.jump;state.filters={};state.dateMode=DATE_MODES[state.tab][0].value;state.expanded=null;state.relationFilter=jump.dataset.relation?{type:jump.dataset.relation.split(":")[0],id:jump.dataset.relation.split(":").slice(1).join(":")}:null;state.query=jump.dataset.search||"";byId("searchInput").value=state.query;render();window.scrollTo({top:0,behavior:"smooth"});}
    });
    byId("modalClose").addEventListener("click",closeModal);
    byId("modalMask").addEventListener("click",(event)=>{if(event.target===byId("modalMask"))closeModal();});
    byId("modalControls").addEventListener("change",(event)=>{
      if(state.modal?.kind!=="analysis")return;
      if(event.target.id==="analysisRange"&&event.target.value!=="custom"){state.modal.quickRange=event.target.value;state.modal.startDate=shiftDate(state.modal.endDate,-Number(event.target.value)+1);renderAnalysisModal();}
      if(event.target.id==="analysisStart"){if(event.target.value>state.modal.endDate){showToast("分析开始日期不能晚于结束日期");renderAnalysisModal();return;}state.modal.startDate=event.target.value;state.modal.quickRange="custom";renderAnalysisModal();}
      if(event.target.id==="analysisEnd"){if(event.target.value<state.modal.startDate){showToast("分析结束日期不能早于开始日期");renderAnalysisModal();return;}state.modal.endDate=event.target.value;state.modal.quickRange="custom";renderAnalysisModal();}
    });
    document.addEventListener("keydown",(event)=>{if(event.key==="Escape"&&state.modal)closeModal();});

    render();
  
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok 广告BI看板 Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a344d'/%3E%3Ctext x='6' y='22' font-size='14' font-family='Arial' font-weight='700' fill='white'%3EBI%3C/text%3E%3C/svg%3E">
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --color-navy-900: #142b3f;
      --color-navy-800: #1a344d;
      --color-navy-700: #264861;
      --color-teal-700: #087c72;
      --color-teal-600: #0b9185;
      --color-teal-100: #e7f5f2;
      --color-blue-100: #edf4fb;
      --color-blue-700: #285f91;
      --color-green-100: #e8f5ee;
      --color-green-700: #1f714e;
      --color-amber-100: #fff4dd;
      --color-amber-700: #965c08;
      --color-red-100: #fdecea;
      --color-red-700: #b23d37;
      --color-slate-25: #fbfcfd;
      --color-slate-50: #f5f7f9;
      --color-slate-100: #edf1f4;
      --color-slate-200: #d9e1e7;
      --color-slate-400: #8998a5;
      --color-slate-600: #60717f;
      --color-slate-800: #24323d;
      --color-white: #ffffff;
      --radius-sm: 5px;
      --radius-md: 8px;
      --shadow-panel: 0 5px 18px rgba(20, 43, 63, 0.07);
      --sidebar-width: 210px;
      --topbar-height: 64px;
    }

    /* ---------- Reset and typography ---------- */
    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--color-slate-800);
      background: var(--color-slate-50);
      font: 13px/1.5 "Microsoft YaHei UI", "PingFang SC", Arial, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(11, 145, 133, 0.24);
      outline-offset: 2px;
    }
    code { font-family: Consolas, "SFMono-Regular", monospace; }

    /* ---------- Application shell ---------- */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
      color: var(--color-white);
      background: var(--color-navy-900);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 7px 24px;
    }
    .brand__mark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      color: var(--color-navy-900);
      background: var(--color-white);
      font-weight: 900;
    }
    .brand__name { display: block; font-weight: 800; }
    .brand__sub { display: block; margin-top: 2px; color: #adc0cf; font-size: 10px; }
    .sidebar__label { padding: 8px 9px; color: #8ea6b8; font-size: 10px; letter-spacing: 0.1em; }
    .menu-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      padding: 11px 10px;
      border: 1px solid var(--color-white);
      border-radius: var(--radius-sm);
      color: var(--color-navy-900);
      background: var(--color-white);
      text-align: left;
      font-weight: 800;
    }
    .menu-button::before { content: "▦"; font-size: 17px; }
    .sidebar__note {
      position: absolute;
      right: 18px;
      bottom: 20px;
      left: 18px;
      color: #adc0cf;
      font-size: 10px;
      line-height: 1.7;
    }
    .main { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      min-height: var(--topbar-height);
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--color-slate-200);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }
    .page-title { margin: 0; font-size: 19px; line-height: 1.2; }
    .page-subtitle { margin: 4px 0 0; color: var(--color-slate-600); font-size: 11px; }
    .topbar__actions { display: flex; align-items: center; gap: 8px; }
    .demo-badge {
      padding: 5px 8px;
      border: 1px solid #edd198;
      border-radius: var(--radius-sm);
      color: var(--color-amber-700);
      background: var(--color-amber-100);
      font-size: 10px;
      white-space: nowrap;
    }
    .workspace { max-width: 1740px; margin: 0 auto; padding: 16px 22px 32px; }

    /* ---------- Buttons and status ---------- */
    .button {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #b9c7d1;
      border-radius: var(--radius-sm);
      color: var(--color-navy-900);
      background: var(--color-white);
      font-weight: 700;
      white-space: nowrap;
    }
    .button:hover { background: var(--color-slate-50); }
    .button--primary { border-color: var(--color-teal-700); color: var(--color-white); background: var(--color-teal-700); }
    .button--primary:hover { background: var(--color-teal-600); }
    .button--quiet { min-height: 28px; padding: 4px 8px; font-size: 11px; }
    .button--link { min-height: auto; padding: 0; border: 0; color: var(--color-teal-700); background: transparent; }
    .button--link:hover { text-decoration: underline; background: transparent; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .status--good { color: var(--color-green-700); background: var(--color-green-100); }
    .status--warn { color: var(--color-amber-700); background: var(--color-amber-100); }
    .status--danger { color: var(--color-red-700); background: var(--color-red-100); }
    .status--info { color: var(--color-blue-700); background: var(--color-blue-100); }
    .status--muted { color: var(--color-slate-600); background: var(--color-slate-100); }
    .tag { display: inline-block; margin: 2px 3px 2px 0; padding: 2px 6px; border-radius: 4px; background: var(--color-slate-100); font-size: 10px; }
    .product-color { display: inline-flex; align-items: center; gap: 5px; margin: 2px 4px 2px 0; padding: 2px 7px; border: 1px solid var(--color-slate-200); border-radius: 999px; background: var(--color-white); font-size: 10px; font-weight: 800; }
    .product-color__dot { width: 9px; height: 9px; border: 1px solid rgba(20,43,63,.22); border-radius: 50%; background: var(--swatch, #8998a5); }
    .inventory-risk { color: var(--color-red-700); font-weight: 800; }
    .raw-value { display: block; margin-top: 3px; color: var(--color-slate-600); font: 9px Consolas, monospace; }
    .metric-good { color: var(--color-green-700); font-weight: 800; }
    .metric-bad { color: var(--color-red-700); font-weight: 800; }

    /* ---------- Navigation and filters ---------- */
    .tab-list {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      overflow-x: auto;
      border: 1px solid var(--color-slate-200);
      border-bottom: 0;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      background: var(--color-white);
      scrollbar-width: thin;
    }
    .tab {
      min-width: 112px;
      padding: 13px 14px 10px;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--color-slate-600);
      background: transparent;
      font-weight: 800;
      white-space: nowrap;
    }
    .tab[aria-selected="true"] { border-bottom-color: var(--color-teal-700); color: var(--color-teal-700); }
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border: 1px solid var(--color-slate-200);
      background: var(--color-white);
      box-shadow: var(--shadow-panel);
    }
    .form-field { display: flex; align-items: center; gap: 6px; color: var(--color-slate-600); font-size: 11px; }
    .form-field select, .form-field input {
      height: 32px;
      padding: 0 9px;
      border: 1px solid var(--color-slate-200);
      border-radius: var(--radius-sm);
      color: var(--color-slate-800);
      background: var(--color-white);
    }
    .form-field input { width: 220px; }
    .form-field input[type="date"] { width: 138px; }
    .filter-extra { display: contents; }
    .filter-scope { margin-left: auto; color: var(--color-slate-600); font-size: 11px; }
    .filter-scope strong { color: var(--color-slate-800); }

    /* ---------- Compact page header context ---------- */
    .context-panel {
      margin: 10px 0;
      border: 1px solid #c8dfda;
      border-radius: var(--radius-md);
      background: var(--color-white);
      overflow: hidden;
    }
    .context-panel__bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      background: #edf7f5;
    }
    .context-panel__title { color: var(--color-teal-700); font-weight: 900; white-space: nowrap; }
    .context-panel__chips { display: flex; min-width: 0; flex: 1; align-items: center; gap: 5px; overflow-x: auto; scrollbar-width: thin; }
    .context-chip { padding: 3px 7px; border: 1px solid #d9e7e4; border-radius: 4px; background: var(--color-white); font-size: 10px; white-space: nowrap; }
    .context-chip span { color: var(--color-slate-600); }
    .field-allocation { color: var(--color-slate-600); font-size: 10px; white-space: nowrap; }
    .context-panel__toggle { min-height: 26px; padding: 3px 8px; border: 1px solid #b9cfc9; border-radius: 4px; color: var(--color-teal-700); background: var(--color-white); font-size: 10px; font-weight: 800; }
    .context-panel__details { display: none; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); border-top: 1px solid #dce8e5; }
    .context-panel__details.is-open { display: grid; }
    .context-detail { min-width: 0; padding: 8px 10px; border-right: 1px solid var(--color-slate-100); border-bottom: 1px solid var(--color-slate-100); }
    .context-detail span { display: block; color: var(--color-slate-600); font-size: 9px; }
    .context-detail strong { display: block; overflow: hidden; margin-top: 2px; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }

    /* ---------- Metrics and panels ---------- */
    .metric-strip { display: grid; grid-template-columns: repeat(6, minmax(118px, 1fr)); margin-bottom: 10px; border: 1px solid var(--color-slate-200); border-radius: var(--radius-md); background: var(--color-white); overflow: hidden; }
    .metric { min-width: 0; padding: 11px 13px; border-right: 1px solid var(--color-slate-200); }
    .metric:last-child { border-right: 0; }
    .metric__label { display: block; color: var(--color-slate-600); font-size: 10px; }
    .metric__value { display: block; overflow: hidden; margin-top: 3px; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-variant-numeric: tabular-nums; }
    .metric__note { display: block; margin-top: 3px; color: var(--color-slate-600); font-size: 9px; }
    .section-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
    .summary-group { border: 1px solid var(--color-slate-200); border-radius: var(--radius-md); background: var(--color-white); box-shadow: var(--shadow-panel); overflow: hidden; }
    .summary-group__head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--color-slate-200); background: var(--color-slate-25); }
    .summary-group__head h2 { margin: 0; font-size: 13px; }
    .summary-group__body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .summary-item { padding: 9px 11px; border-right: 1px solid var(--color-slate-100); border-bottom: 1px solid var(--color-slate-100); }
    .summary-item span { display: block; color: var(--color-slate-600); font-size: 9px; }
    .summary-item strong { display: block; margin-top: 2px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .panel { border: 1px solid var(--color-slate-200); border-radius: var(--radius-md); background: var(--color-white); box-shadow: var(--shadow-panel); overflow: hidden; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--color-slate-200); }
    .panel__head h2 { margin: 0; font-size: 14px; }
    .panel__head p { margin: 2px 0 0; color: var(--color-slate-600); font-size: 10px; }
    .panel__count { color: var(--color-slate-600); font-size: 10px; white-space: nowrap; }
    .panel__count strong { color: var(--color-teal-700); }
    .notice { padding: 8px 12px; border-bottom: 1px solid #edd9a8; color: #735119; background: #fff9ed; font-size: 10px; }

    /* ---------- Data table ---------- */
    .table-scroll { position: relative; max-height: 620px; overflow: auto; }
    .data-table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; font-size: 11px; }
    .data-table th {
      position: sticky;
      top: 0;
      z-index: 5;
      min-width: 120px;
      padding: 9px 10px;
      border-right: 1px solid #dfe6eb;
      border-bottom: 1px solid var(--color-slate-200);
      color: #506170;
      background: #edf2f5;
      text-align: left;
      font-weight: 800;
    }
    .data-table td { min-width: 120px; max-width: 280px; padding: 8px 10px; border-right: 1px solid #edf1f3; border-bottom: 1px solid #edf1f3; background: var(--color-white); vertical-align: middle; }
    .data-table tbody tr.data-row:hover td { background: #f7fbfa; }
    .data-table .cell--key { position: sticky; left: 0; z-index: 4; min-width: 190px; max-width: 240px; background: #f6fbfa; box-shadow: 1px 0 0 #cfdbdf; }
    .data-table th.cell--key { z-index: 8; background: #dceeea; }
    .data-table .cell--wide { min-width: 220px; white-space: normal; line-height: 1.55; }
    .data-table .cell--numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .data-table .cell--actions { min-width: 186px; }
    .primary-text { color: var(--color-navy-900); font-weight: 900; }
    .secondary-text { display: block; margin-top: 2px; color: var(--color-slate-600); font-size: 9px; }
    .thumbnail { display: flex; align-items: center; gap: 8px; }
    .thumbnail__image { display: grid; width: 38px; height: 48px; flex: 0 0 auto; place-items: center; border-radius: 5px; color: var(--color-white); background: linear-gradient(145deg, #234a68, #81a6bc); }
    .thumbnail__image--creator { background: linear-gradient(145deg, #76523a, #d6a078); }
    .detail-row td { max-width: none; padding: 0; white-space: normal; background: #f4f8fa; }
    .inline-detail { padding: 14px 16px; border-top: 2px solid var(--color-teal-700); }
    .inline-detail__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .inline-detail__head h3 { margin: 0; font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .detail-card { padding: 9px 10px; border: 1px solid var(--color-slate-200); border-radius: var(--radius-sm); background: var(--color-white); }
    .detail-card span { display: block; color: var(--color-slate-600); font-size: 9px; }
    .detail-card strong { display: block; margin-top: 2px; }
    .history-table { width: 100%; margin-top: 9px; border-collapse: collapse; background: var(--color-white); font-size: 10px; }
    .history-table th, .history-table td { padding: 7px 8px; border: 1px solid var(--color-slate-200); text-align: left; }
    .history-table th { background: var(--color-slate-100); }
    .empty-state { padding: 52px 20px; color: var(--color-slate-600); text-align: center; }

    /* ---------- Modal ---------- */
    .modal-mask { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(8, 24, 36, 0.52); }
    .modal-mask.is-open { display: flex; }
    .modal { display: flex; width: min(1080px, 96vw); max-height: 94vh; flex-direction: column; border-radius: var(--radius-md); background: var(--color-white); box-shadow: 0 24px 70px rgba(9, 24, 36, 0.28); overflow: hidden; }
    .modal__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--color-slate-200); }
    .modal__head h2 { margin: 0; font-size: 17px; }
    .modal__head p { margin: 3px 0 0; color: var(--color-slate-600); font-size: 10px; }
    .modal__close { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border: 0; border-radius: var(--radius-sm); color: var(--color-navy-900); background: var(--color-slate-100); font-size: 18px; }
    .modal__controls { display: flex; align-items: flex-end; gap: 9px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--color-slate-200); background: var(--color-slate-50); }
    .modal__body { padding: 14px 18px 18px; overflow: auto; }
    .analysis-grid { display: grid; grid-template-columns: minmax(460px, 1.5fr) minmax(280px, 0.8fr); gap: 10px; }
    .analysis-card { min-width: 0; border: 1px solid var(--color-slate-200); border-radius: var(--radius-sm); overflow: hidden; }
    .analysis-card__head { padding: 8px 10px; border-bottom: 1px solid var(--color-slate-200); background: var(--color-slate-50); font-weight: 800; }
    .analysis-card__body { padding: 11px; }
    .chart { width: 100%; height: 220px; }
    .chart__axis { stroke: #bdc8d0; stroke-width: 1; }
    .chart__line { fill: none; stroke: var(--color-teal-700); stroke-width: 3; }
    .chart__dot { fill: var(--color-white); stroke: var(--color-teal-700); stroke-width: 2; }
    .chart__label { fill: var(--color-slate-600); font-size: 9px; }
    .insight { line-height: 1.75; }
    .insight__boundary { margin-top: 10px; padding: 8px 9px; border-left: 3px solid #d58a21; color: #71501d; background: var(--color-amber-100); }
    .inventory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .inventory-card { padding: 10px; border: 1px solid var(--color-slate-200); border-radius: var(--radius-sm); }
    .inventory-card.is-oos { border-color: #e6b9b5; background: var(--color-red-100); }

    /* ---------- Feedback ---------- */
    .toast { position: fixed; bottom: 24px; left: 50%; z-index: 100; max-width: min(560px, 90vw); padding: 9px 13px; border-radius: var(--radius-sm); color: var(--color-white); background: var(--color-navy-900); box-shadow: var(--shadow-panel); opacity: 0; pointer-events: none; transform: translate(-50%, 14px); transition: 0.2s ease; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .metric-strip { grid-template-columns: repeat(3, minmax(118px, 1fr)); }
      .metric:nth-child(3n) { border-right: 0; }
      .metric:nth-child(-n+3) { border-bottom: 1px solid var(--color-slate-200); }
      .section-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; display: flex; height: auto; align-items: center; gap: 10px; padding: 9px 12px; }
      .brand { min-width: 166px; padding: 0; }
      .brand__sub, .sidebar__label, .sidebar__note { display: none; }
      .menu-button { width: auto; padding: 8px 10px; }
      .topbar { top: 61px; padding: 9px 13px; }
      .workspace { padding: 11px 12px 24px; }
      .filter-scope { width: 100%; margin-left: 0; }
      .field-allocation { display: none; }
      .analysis-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .brand { min-width: 0; }
      .brand__name { display: none; }
      .topbar { align-items: flex-start; }
      .page-subtitle, .demo-badge { display: none; }
      .workspace { padding: 8px; }
      .tab { min-width: 98px; padding: 11px 10px 8px; }
      .filter-bar { align-items: stretch; }
      .form-field { width: 100%; justify-content: space-between; }
      .form-field select, .form-field input { width: 68%; }
      .context-panel__bar { align-items: flex-start; flex-wrap: wrap; }
      .context-panel__chips { order: 3; width: 100%; }
      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric, .metric:nth-child(3n) { border-right: 1px solid var(--color-slate-200); border-bottom: 1px solid var(--color-slate-200); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric__value { font-size: 16px; }
      .panel__head { align-items: flex-start; }
      .data-table .cell--key { position: static; box-shadow: none; }
      .detail-grid, .inventory-grid { grid-template-columns: 1fr; }
      .modal-mask { padding: 0; }
      .modal { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
      .modal__head, .modal__controls, .modal__body { padding-right: 12px; padding-left: 12px; }
      .analysis-grid { display: block; }
      .analysis-card { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark">AI</div>
        <div><span class="brand__name">思唯的工作台</span><span class="brand__sub">运营管理</span></div>
      </div>
      <div class="sidebar__label">TIKTOK</div>
      <button class="menu-button" type="button" data-testid="menu-ad-bi">广告BI看板</button>
      <div class="sidebar__note">本地交互 Demo<br>模拟数据不代表实时广告后台</div>

      return (state.site === "all" || row.site === state.site) && (state.store === "all" || row.store === state.store);
    }

    function matchesQuery(row) {
      if (!state.query) return true;
      return JSON.stringify(row).toLowerCase().includes(state.query.toLowerCase());
    }

    function campaignRows() {
      let rows = campaigns.filter(inScope);
      if (state.dateMode === "schedule") rows = rows.filter((row) => overlapsRange(row.start,row.end));
      if (state.relationFilter?.type === "spu") rows = rows.filter((row) => row.spus.includes(state.relationFilter.id));
      if (state.relationFilter?.type === "pid") rows = rows.filter((row) => row.pids.includes(state.relationFilter.id));
      if (filterValue("campaignStatus") !== "all") rows = rows.filter((row) => row.status === filterValue("campaignStatus"));
      if (filterValue("campaignType") !== "all") rows = rows.filter((row) => row.type === filterValue("campaignType"));
      if (filterValue("campaignTag") !== "all") rows = rows.filter((row) => row.tag === filterValue("campaignTag"));
      return rows.filter(matchesQuery);
    }

    function pidRows() {
      let rows = pidRecords.filter(inScope);
      if (filterValue("mapStatus") !== "all") rows = rows.filter((row) => row.mapStatus === filterValue("mapStatus"));
      if (filterValue("inventoryRisk") === "risk") rows = rows.filter((row) => row.hotOos >= 30);
      if (filterValue("inventoryRisk") === "safe") rows = rows.filter((row) => row.hotOos < 30);
      if (filterValue("deliveryState") !== "all") rows = rows.filter((row) => {
        const active = campaignsForIds(row.campaignIds).some((campaign) => campaign.status === "投放中");
        return filterValue("deliveryState") === "active" ? active : !active;
      });
      return rows.filter(matchesQuery);
    }

    function spuRows() {
      const groups = {};
      pidRecords.filter(inScope).forEach((pid) => {
        const key = `${pid.store}|${pid.spu}`;
        if (!groups[key]) groups[key] = { site:pid.site, store:pid.store, spu:pid.spu, name:pid.name, pids:[], campaignIds:[], inventory:0, hotOos:0, totalOrders:0, financialGmv:0, openActions:0 };
        const group = groups[key];
        group.pids.push(pid.pid);
        group.campaignIds.push(...pid.campaignIds);
        group.inventory += pid.inventory;
        group.hotOos = Math.max(group.hotOos, pid.hotOos);
        group.totalOrders += pid.totalOrders;
        group.financialGmv += pid.financialGmv;
        group.openActions += pid.openActions;
      });
      let rows = Object.values(groups).map((group) => ({ ...group, campaignIds:unique(group.campaignIds), tag:group.hotOos >= 30 ? "库存风险" : group.spu === "W0228" ? "季节返场" : "稳定贡献", diagnosis:group.hotOos >= 30 ? "热卖码断货影响广告继续放量。" : "广告、素材和库存暂未出现高风险。", suggest:group.hotOos >= 30 ? "先处理库存，再评估广告加热。" : "按当前节奏继续观察。" }));
      if (filterValue("inventoryRisk") === "risk") rows = rows.filter((row) => row.hotOos >= 30);

      });
      return rows.filter(matchesQuery);

    function creativeRows() {

      if (state.relationFilter?.type === "pid") rows = rows.filter((row) => row.pidList.includes(state.relationFilter.id));
      if (state.relationFilter?.type === "spu") {

        rows = rows.filter((row) => row.pidList.some((pid) => ids.includes(pid)));

      const total = rows.length;

      const otherUnavailable = rows.filter((row) => row.available !== "可用" && row.auth !== "已过期").length;

      const explored = rows.filter((row) => row.explore === "已探索").length;
      const pendingExplore = rows.filter((row) => row.explore === "待获取").length;

      const decline = rows.filter((row) => row.available === "可用" && /衰退/.test(row.internal)).length;

      const heated = rows.filter((row) => /已加热/.test(row.heat)).length;
      const reheat = rows.filter((row) => row.available === "可用" && (/衰退|返场/.test(row.internal))).length;
      return { historical:total, current:total, available, expired, otherUnavailable, exploring, explored, pendingExplore, high, decline, heating, heated, reheat };
    }

    function colorRollup(rows) {
      const groups = {};
      rows.forEach((creative) => {
        const color = creative.mainColor || "待确认";
        if (!groups[color]) groups[color] = {color,creatives:[],cost:0,orders:0,revenue:0,stocks:[]};
        const group = groups[color];
        group.creatives.push(creative);
        group.cost += creative.cost;
        group.orders += creative.orders;
        group.revenue += creative.revenue;
        colorStocksForCreative(creative).forEach((stock) => {
          if (!group.stocks.some((item) => item.pid === stock.pid && item.color === stock.color)) group.stocks.push(stock);
        });
      });
      return Object.values(groups).map((group) => {
        const stock = sum(group.stocks,"stock");
        const inbound = sum(group.stocks,"inbound");
        const days = group.stocks.length ? Math.min(...group.stocks.map((item) => item.days)) : null;
        const hotOos = group.stocks.length ? Math.max(...group.stocks.map((item) => item.hotOos)) : null;
        return {...group,stock,inbound,days,hotOos,roi:group.cost?group.revenue/group.cost:0,decision:colorRestockDecision(group.stocks[0],group.creatives)};

    function dailySeries(type, id, startDate, endDate, variant = "current") {
      const entity = analysisEntity(type,id);
      if (!entity) return [];
      const days = daysInRange(startDate,endDate);
      const seed = Array.from(`${type}:${id}:${variant}`).reduce((value,char)=>value+char.charCodeAt(0),0);
      let weights = [];
      for (let index=0; index<days; index+=1) weights.push(0.8 + ((seed + index * 13) % 31) / 50);
      const weightTotal = weights.reduce((a,b)=>a+b,0);
      const costFactor = variant === "previous" ? 0.88 + (seed % 9) / 100 : 1;
      const orderFactor = variant === "previous" ? 0.82 + (seed % 13) / 100 : 1;
      const revenueFactor = variant === "previous" ? 0.84 + (seed % 15) / 100 : 1;
      const creative = entity.relatedCreatives?.[0];
      return weights.map((weight,index) => {
        const share = weight / weightTotal;
        const cost = entity.metrics.cost * costFactor * share;
        const orderShare = share * (0.9 + ((seed + index * 7) % 9) / 45);
        const orders = Math.max(0, Math.round(entity.metrics.orders * orderFactor * orderShare));
        const revenue = entity.metrics.revenue * revenueFactor * share * (0.92 + ((seed + index * 11) % 11) / 55);
        return { date:shiftDate(endDate,index-days+1), budget:entity.dailyBudget, cost, orders, revenue, roi:cost?revenue/cost:0, delivery:creative?.delivery || "—", explore:creative ? `${creative.explore} / ${creative.performance}` : "—" };
      });
    }

    }

    function chartSvg(rows) {
      const width = 660, height = 220, pad = 34;
      const max = Math.max(1,...rows.map((row)=>row.roi));
      const step = rows.length > 1 ? (width-pad*2)/(rows.length-1) : 0;
      const points = rows.map((row,index)=>({x:pad+index*step,y:height-pad-(row.roi/max)*(height-pad*2),...row}));
      const labels = points.filter((_,index)=>index===0||index===points.length-1||index%Math.ceil(points.length/5)===0);
      return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="ROI日趋势"><line class="chart__axis" x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}"></line><line class="chart__axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${height-pad}"></line><polyline class="chart__line" points="${points.map((point)=>`${point.x},${point.y}`).join(" ")}"></polyline>${points.map((point)=>`<circle class="chart__dot" cx="${point.x}" cy="${point.y}" r="4"><title>${point.date} · ROI ${point.roi.toFixed(2)}x</title></circle>`).join("")}${labels.map((point)=>`<text class="chart__label" x="${point.x}" y="${height-10}" text-anchor="middle">${point.date.slice(5)}</text>`).join("")}</svg>`;

        {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
        {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xml(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
        {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
        {name:"xl/styles.xml",data:'<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF087C72"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
        {name:"xl/worksheets/sheet1.xml",data:`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${end}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>${headers.map((_,index)=>`<col min="${index+1}" max="${index+1}" width="18" customWidth="1"/>`).join("")}</cols><sheetData>${sheetRows}</sheetData><autoFilter ref="A1:${end}"/></worksheet>`}
      ];
      return new Blob([zipStore(files)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    }

    function exportCurrent() {
      const headers = FIELD_SCHEMAS[state.tab];
      if (!state.currentMaps.length) { showToast("当前筛选没有可导出的数据"); return; }
      const rows = state.currentMaps.map((map)=>headers.map((field)=>map[field] == null || map[field] === "" ? "—" : map[field]));
      const blob = xlsxBlob(headers,rows,TAB_META[state.tab].label);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `TK广告BI_${TAB_META[state.tab].label}_2026-09-04.xlsx`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast(`已导出 ${rows.length} 条，包含 ${headers.length} 个映射字段`);
    }

    /* ---------- Events ---------- */
    document.querySelector(".tab-list").addEventListener("click",(event)=>{
      const button=event.target.closest("[data-tab]");
      if(!button)return;
      state.tab=button.dataset.tab;state.query="";state.filters={};state.dateMode=DATE_MODES[state.tab][0].value;state.relationFilter=null;state.expanded=null;byId("searchInput").value="";render();window.scrollTo({top:0,behavior:"smooth"});
    });
    byId("dateFilter").addEventListener("change",(event)=>{if(event.target.value==="custom")return;state.quickRange=event.target.value;state.days=Number(event.target.value);state.startDate=shiftDate(state.endDate,-state.days+1);render();});
    byId("dateMode").addEventListener("change",(event)=>{state.dateMode=event.target.value;render();});
    byId("startDate").addEventListener("change",(event)=>{if(event.target.value>state.endDate){showToast("开始日期不能晚于结束日期");event.target.value=state.startDate;return;}state.startDate=event.target.value;state.days=daysInRange(state.startDate,state.endDate);state.quickRange="custom";render();});
    byId("endDate").addEventListener("change",(event)=>{if(event.target.value<state.startDate){showToast("结束日期不能早于开始日期");event.target.value=state.endDate;return;}state.endDate=event.target.value;state.days=daysInRange(state.startDate,state.endDate);state.quickRange="custom";render();});
    byId("siteFilter").addEventListener("change",(event)=>{state.site=event.target.value;state.store=state.site==="all"?"all":Object.keys(ACCOUNTS).find((store)=>ACCOUNTS[store].site===state.site)||"all";byId("storeFilter").value=state.store;state.relationFilter=null;render();});
    byId("storeFilter").addEventListener("change",(event)=>{state.store=event.target.value;state.site=state.store==="all"?"all":ACCOUNTS[state.store].site;byId("siteFilter").value=state.site;state.relationFilter=null;render();});
    byId("tabFilters").addEventListener("change",(event)=>{const control=event.target.closest("[data-tab-filter]");if(!control)return;state.filters[control.dataset.tabFilter]=control.value;state.relationFilter=null;render();});
    byId("searchInput").addEventListener("input",(event)=>{state.query=event.target.value.trim();state.relationFilter=null;render();});
    byId("contextToggle").addEventListener("click",()=>{state.contextOpen=!state.contextOpen;renderContext();});
    byId("exportButton").addEventListener("click",exportCurrent);
    byId("viewRoot").addEventListener("click",(event)=>{
      const analyze=event.target.closest("[data-analyze]");if(analyze){openAnalysis(analyze.dataset.analyze);return;}
      const inventory=event.target.closest("[data-inventory]");if(inventory){openInventory(inventory.dataset.inventory);return;}
      const task=event.target.closest("[data-create-task]");if(task){createTask(task.dataset.createTask);return;}
      const expand=event.target.closest("[data-expand]");if(expand){state.expanded=state.expanded===expand.dataset.expand?null:expand.dataset.expand;render();return;}
      if(event.target.closest("[data-collapse]")){state.expanded=null;render();return;}
      const jump=event.target.closest("[data-jump]");if(jump){state.tab=jump.dataset.jump;state.filters={};state.dateMode=DATE_MODES[state.tab][0].value;state.expanded=null;state.relationFilter=jump.dataset.relation?{type:jump.dataset.relation.split(":")[0],id:jump.dataset.relation.split(":").slice(1).join(":")}:null;state.query=jump.dataset.search||"";byId("searchInput").value=state.query;render();window.scrollTo({top:0,behavior:"smooth"});}
    });
    byId("viewRoot").addEventListener("change",(event)=>{
      if(!event.target.matches("[data-action-status]"))return;
      const row=actions.find((item)=>item.id===event.target.dataset.actionStatus);if(!row)return;row.taskStatus=event.target.value;render();showToast(`任务 ${row.id} 已更新为${row.taskStatus}（仅本地Demo）`);
    });
    byId("modalClose").addEventListener("click",closeModal);
    byId("modalMask").addEventListener("click",(event)=>{if(event.target===byId("modalMask"))closeModal();});
    byId("modalControls").addEventListener("change",(event)=>{
      if(state.modal?.kind!=="analysis")return;
      if(event.target.id==="analysisRange"&&event.target.value!=="custom"){state.modal.quickRange=event.target.value;state.modal.startDate=shiftDate(state.modal.endDate,-Number(event.target.value)+1);renderAnalysisModal();}
      if(event.target.id==="analysisStart"){if(event.target.value>state.modal.endDate){showToast("分析开始日期不能晚于结束日期");renderAnalysisModal();return;}state.modal.startDate=event.target.value;state.modal.quickRange="custom";renderAnalysisModal();}
      if(event.target.id==="analysisEnd"){if(event.target.value<state.modal.startDate){showToast("分析结束日期不能早于开始日期");renderAnalysisModal();return;}state.modal.endDate=event.target.value;state.modal.quickRange="custom";renderAnalysisModal();}
    });
    document.addEventListener("keydown",(event)=>{if(event.key==="Escape"&&state.modal)closeModal();});

    render();
  </script>
</body>
</html>
